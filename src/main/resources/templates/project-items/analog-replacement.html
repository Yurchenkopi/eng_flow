<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Распределить по аналогам')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{p}/items/{id}/edit(p=${project.id},id=${projectItem.id})}">← К позиции</a><header class="page-header"><div><h1 class="page-title">Распределить по аналогам</h1><p class="page-subtitle" th:text="${(projectItem.catalogItem.designation?:'—')+' — '+projectItem.catalogItem.name}"></p></div></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card"><div th:if="${#lists.isEmpty(analogs)}" class="empty-state"><strong>Для изделия не заданы аналоги</strong><span>Добавьте аналоги в карточке изделия каталога.</span></div><form th:unless="${#lists.isEmpty(analogs)}" method="post" th:object="${replacement}"><div class="form-card"><label class="form-label">Аналог *</label><select class="form-select" th:field="*{targetCatalogItemId}" required><option value="">Выберите аналог</option><option th:each="analog:${analogs}" th:value="${analog.id}" th:text="${(analog.designation?:'—')+' — '+analog.name+(analog.manufacturer!=null?' · '+analog.manufacturer:'')}"></option></select></div><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>Раздел / подраздел / применяется для</th><th>Исходно</th><th>Оставить оригиналом</th><th>Передать аналогу</th><th>Ед.</th></tr></thead><tbody><tr th:each="allocation,stat:${projectItem.allocations}"><td><strong th:text="${allocation.projectAssembly!=null?allocation.projectAssembly.name:'Без раздела'}"></strong><small class="cell-meta" th:if="${allocation.projectSubsection!=null}" th:text="${allocation.projectSubsection.designation+(allocation.appliesFor!=null?' → '+allocation.appliesFor:'')}"></small><small class="cell-meta" th:if="${allocation.notes!=null}" th:text="${allocation.notes}"></small><input type="hidden" th:field="*{rows[__${stat.index}__].sourceAllocationId}"></td><td th:text="${allocation.quantity.stripTrailingZeros().toPlainString()}"></td><td><input class="form-control replacement-original" type="number" min="0" th:step="${projectItem.catalogItem.quantityStep}" th:field="*{rows[__${stat.index}__].originalQuantity}" required></td><td><input class="form-control replacement-analog" type="number" min="0" th:step="${projectItem.catalogItem.quantityStep}" th:field="*{rows[__${stat.index}__].replacementQuantity}" required></td><td th:text="${projectItem.catalogItem.unit}"></td></tr></tbody></table></div><div class="form-actions px-3"><button class="btn btn-primary">Сохранить перераспределение</button><a class="btn btn-outline-secondary" th:href="@{/projects/{p}/items/{id}/edit(p=${project.id},id=${projectItem.id})}">Отмена</a></div></form></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script>document.querySelectorAll('tbody tr').forEach(row=>{const original=row.querySelector('.replacement-original'),analog=row.querySelector('.replacement-analog');if(!original||!analog)return;const total=Number(original.value||0)+Number(analog.value||0);original.addEventListener('input',()=>analog.value=Math.max(0,total-Number(original.value||0)));analog.addEventListener('input',()=>original.value=Math.max(0,total-Number(analog.value||0)))});</script></body></html>
