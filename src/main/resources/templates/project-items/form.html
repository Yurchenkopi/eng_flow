<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="container-fluid px-4 py-4"><div class="page-heading mb-3"><h1 th:text="${pageTitle}"></h1><p th:text="${project.designation + ' — ' + project.name}"></p></div><form class="content-card form-card" method="post" th:object="${projectItem}" th:action="${projectItem.id == null} ? @{/projects/{p}/items(p=${project.id})} : @{/projects/{p}/items/{id}(p=${project.id},id=${projectItem.id})}"><div class="alert alert-danger py-2" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div><div class="row g-3">
<div class="col-12"><label class="form-label" for="catalog-search">Изделие <span class="required">*</span></label><input type="hidden" id="catalog-item-id" th:field="*{catalogItem.id}"><div class="autocomplete"><input id="catalog-search" class="form-control" type="search" autocomplete="off" placeholder="Введите обозначение, наименование или производителя"><div id="catalog-results" class="autocomplete-results d-none"></div></div><div id="selected-item" class="selected-item mt-2" th:classappend="${projectItem.catalogItem != null and projectItem.catalogItem.id != null} ? '' : ' d-none'"><strong id="selected-name" th:text="${projectItem.catalogItem != null ? projectItem.catalogItem.name : ''}"></strong><span id="selected-meta" th:text="${projectItem.catalogItem != null ? ((projectItem.catalogItem.designation ?: '') + (projectItem.catalogItem.manufacturer != null ? ' · ' + projectItem.catalogItem.manufacturer : '')) : ''}"></span></div><div class="text-danger small" th:errors="*{catalogItem}"></div></div>
<div class="col-md-4"><label class="form-label">Количество <span class="required">*</span></label><input class="form-control" type="number" min="0.0001" step="0.0001" th:field="*{requiredQuantity}"><div class="text-danger small" th:errors="*{requiredQuantity}"></div></div><div class="col-md-8"><label class="form-label">Раздел</label><select class="form-select" th:field="*{projectAssembly.id}"><option value="">Без раздела</option><option th:each="assembly : ${assemblies}" th:value="${assembly.id}" th:text="${assembly.designation != null ? assembly.designation + ' — ' + assembly.name : assembly.name}"></option></select></div><div class="col-12"><label class="form-label">Примечание</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">Сохранить</button><a class="btn btn-outline-secondary" th:href="@{/projects/{id}/configuration(id=${project.id})}">Отмена</a></div></form></main><script th:replace="~{fragments/layout :: scripts}"></script>
<script th:inline="javascript">const search=document.getElementById('catalog-search'),results=document.getElementById('catalog-results'),id=document.getElementById('catalog-item-id'),selected=document.getElementById('selected-item'),selectedName=document.getElementById('selected-name'),selectedMeta=document.getElementById('selected-meta'),createUrl=/*[[@{/catalog-items/new(projectId=${project.id})}]]*/'';let timer;function clearSelection(){id.value='';selected.classList.add('d-none');selectedName.textContent='';selectedMeta.textContent='';}function choose(item){id.value=item.id;selectedName.textContent=item.name;selectedMeta.textContent=[item.designation,item.manufacturer].filter(Boolean).join(' · ');selected.classList.remove('d-none');search.value='';results.classList.add('d-none');}function render(items){results.replaceChildren();if(items.length===0){const empty=document.createElement('div');empty.className='autocomplete-empty';empty.textContent='Ничего не найдено';results.append(empty);}for(const item of items){const button=document.createElement('button');button.type='button';button.className='autocomplete-option';button.innerHTML='<strong></strong><span></span>';button.querySelector('strong').textContent=item.name;button.querySelector('span').textContent=[item.designation,item.manufacturer].filter(Boolean).join(' · ')||'Без обозначения и производителя';button.addEventListener('click',()=>choose(item));results.append(button);}const create=document.createElement('a');create.className='autocomplete-create';create.href=createUrl;create.textContent='+ Создать новое изделие';results.append(create);results.classList.remove('d-none');}search.addEventListener('input',()=>{clearTimeout(timer);clearSelection();const query=search.value.trim();if(!query){results.classList.add('d-none');return;}timer=setTimeout(async()=>{const response=await fetch('/catalog-items/search?query='+encodeURIComponent(query));render(await response.json());},200);});document.addEventListener('click',event=>{if(!event.target.closest('.autocomplete'))results.classList.add('d-none');});</script></body></html>
