<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body>
<nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="container-fluid px-4 py-4"><div class="page-heading mb-3"><h1 th:text="${pageTitle}"></h1><p th:text="${project.designation+' — '+project.name}"></p></div><div th:replace="~{fragments/layout :: messages}"></div>
<form class="content-card form-card form-card-full" method="post" th:object="${projectItem}" th:action="${projectItem.id==null}?@{/projects/{p}/items(p=${project.id})}:@{/projects/{p}/items/{id}(p=${project.id},id=${projectItem.id})}">
<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error:${#fields.globalErrors()}" th:text="${error}"></div><div class="row g-3">
<div class="col-12"><label class="form-label" for="catalog-search">Изделие <span class="required">*</span></label><input type="hidden" id="catalog-item-id" th:field="*{catalogItem.id}"><div class="autocomplete"><input id="catalog-search" class="form-control" type="search" autocomplete="off" placeholder="Введите обозначение, наименование или производителя"><div id="catalog-results" class="autocomplete-results d-none"></div></div><div id="selected-item" class="selected-item mt-2" th:classappend="${projectItem.catalogItem!=null and projectItem.catalogItem.id!=null}?'':' d-none'"><strong id="selected-name" th:text="${projectItem.catalogItem!=null?projectItem.catalogItem.name:''}"></strong><span id="selected-meta" th:text="${projectItem.catalogItem!=null?((projectItem.catalogItem.designation?:'')+(projectItem.catalogItem.manufacturer!=null?' · '+projectItem.catalogItem.manufacturer:'')):''}"></span></div></div>
<div class="col-12"><div class="d-flex justify-content-between align-items-center"><label class="form-label mb-0">Распределение по разделам</label><button id="add-allocation" class="btn btn-secondary btn-sm" type="button">+ Добавить строку</button></div><div id="allocations" class="mt-2">
<div class="allocation-row border rounded p-2 mb-2" th:each="allocation,stat:*{allocations}"><input type="hidden" class="allocation-id" th:field="*{allocations[__${stat.index}__].id}"><div class="row g-2 align-items-start">
<div class="col-md-6"><label class="form-label">Раздел</label><select class="form-select allocation-assembly" th:field="*{allocations[__${stat.index}__].projectAssembly.id}"><option value="">Без раздела</option><option th:each="assembly:${assemblies}" th:value="${assembly.id}" th:text="${assembly.name}"></option></select></div>
<div class="col-md-3"><label class="form-label">Количество</label><input class="form-control allocation-quantity" type="number" th:min="${projectItem.catalogItem!=null and projectItem.catalogItem.id!=null?projectItem.catalogItem.quantityStep:'0.0001'}" th:step="${projectItem.catalogItem!=null and projectItem.catalogItem.id!=null?projectItem.catalogItem.quantityStep:'0.0001'}" th:field="*{allocations[__${stat.index}__].quantity}"><div class="text-danger small" th:errors="*{allocations[__${stat.index}__].quantity}"></div></div>
<div class="col-md-2"><label class="form-label">Примечание</label><input class="form-control" th:field="*{allocations[__${stat.index}__].notes}"></div><div class="col-md-1 pt-4"><button class="btn btn-ghost text-danger remove-allocation" type="button">×</button></div>
<div class="col-12"><div class="form-check"><input class="form-check-input detail-toggle" type="checkbox" th:id="${'allocation-detail-'+stat.index}" th:field="*{allocations[__${stat.index}__].detailForTransfer}"><label class="form-check-label" th:for="${'allocation-detail-'+stat.index}">Детализировать для передачи в цех</label></div></div>
<div class="detail-fields row g-2 mt-0" th:classappend="${allocation.detailForTransfer}?'':' d-none'"><div class="col-md-6"><label class="form-label">Подраздел</label><input class="form-control" th:field="*{allocations[__${stat.index}__].subsectionDesignation}" placeholder="Обозначение сборки/узла"></div><div class="col-md-6"><label class="form-label">Применяется для</label><input class="form-control" th:field="*{allocations[__${stat.index}__].subsectionAppliesFor}" placeholder="Обозначение и наименование детали"></div></div>
</div></div></div><div class="small text-muted">Итого: <strong id="allocation-total">0</strong> <span th:text="${projectItem.catalogItem!=null?projectItem.catalogItem.unit:''}"></span></div></div>
<div class="col-12"><label class="form-label">Общее примечание</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">Сохранить</button><a class="btn btn-outline-secondary" th:href="@{/projects/{id}/configuration(id=${project.id})}">Отмена</a></div></form><form th:if="${projectItem.id!=null}" class="mt-3" method="post" th:action="@{/projects/{p}/items/{id}/delete(p=${project.id},id=${projectItem.id})}" onsubmit="return confirm('Удалить позицию из комплектации целиком?')"><button class="btn btn-outline-danger">Удалить позицию из комплектации</button></form></main><script th:replace="~{fragments/layout :: scripts}"></script>
<script>const box=document.getElementById('allocations'),total=document.getElementById('allocation-total');function reindex(){[...box.querySelectorAll('.allocation-row')].forEach((row,i)=>{row.querySelectorAll('[name]').forEach(el=>el.name=el.name.replace(/allocations\[\d+\]/,`allocations[${i}]`));const toggle=row.querySelector('.detail-toggle'),label=row.querySelector('label.form-check-label');toggle.id=`allocation-detail-${i}`;label.htmlFor=toggle.id});total.textContent=[...box.querySelectorAll('.allocation-quantity')].reduce((sum,input)=>sum+(parseFloat(input.value)||0),0).toLocaleString('ru-RU')}function wire(row){row.querySelector('.remove-allocation').onclick=()=>{if(box.children.length>1){row.remove();reindex()}};row.querySelector('.allocation-quantity').addEventListener('input',reindex);const toggle=row.querySelector('.detail-toggle'),fields=row.querySelector('.detail-fields');toggle.onchange=()=>{fields.classList.toggle('d-none',!toggle.checked);if(!toggle.checked)fields.querySelectorAll('input').forEach(i=>i.value='')}}[...box.children].forEach(wire);document.getElementById('add-allocation').onclick=()=>{const row=box.firstElementChild.cloneNode(true);row.querySelectorAll('input').forEach(input=>{input.value='';if(input.type==='checkbox')input.checked=false});row.querySelector('select').value='';row.querySelector('.detail-fields').classList.add('d-none');box.append(row);wire(row);reindex()};reindex();</script>
<script th:inline="javascript">const search=document.getElementById('catalog-search'),results=document.getElementById('catalog-results'),catalogId=document.getElementById('catalog-item-id'),selected=document.getElementById('selected-item'),selectedName=document.getElementById('selected-name'),selectedMeta=document.getElementById('selected-meta'),createUrl=/*[[@{/catalog-items/new(projectId=${project.id})}]]*/'',projectId=/*[[${project.id}]]*/0;let timer;async function choose(item){const existing=await(await fetch(`/projects/${projectId}/items/existing?catalogItemId=${item.id}`)).json();if(existing.exists){window.location.assign(existing.url);return}catalogId.value=item.id;selectedName.textContent=item.name;selectedMeta.textContent=[item.designation,item.manufacturer].filter(Boolean).join(' · ');selected.classList.remove('d-none');search.value='';results.classList.add('d-none')}function render(items){results.replaceChildren();for(const item of items){const button=document.createElement('button');button.type='button';button.className='autocomplete-option';button.textContent=[item.designation,item.name,item.manufacturer].filter(Boolean).join(' · ');button.onclick=()=>choose(item);results.append(button)}const create=document.createElement('a');create.className='autocomplete-create';create.href=createUrl;create.textContent='+ Создать новое изделие';results.append(create);results.classList.remove('d-none')}search.addEventListener('input',()=>{clearTimeout(timer);catalogId.value='';const query=search.value.trim();if(!query){results.classList.add('d-none');return}timer=setTimeout(async()=>render(await(await fetch('/catalog-items/search?query='+encodeURIComponent(query))).json()),200)});document.addEventListener('click',event=>{if(!event.target.closest('.autocomplete'))results.classList.add('d-none')});</script></body></html>
