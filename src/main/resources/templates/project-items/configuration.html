<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Комплектация')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← К проекту</a><header class="page-header"><div><h1 class="page-title" th:text="${project.designation}"></h1><p class="page-subtitle" th:text="${project.name}"></p><h2 class="section-heading">Комплектация</h2></div><div class="header-actions"><a class="btn btn-secondary btn-sm" th:href="@{/projects/{id}/procurements(id=${project.id})}">Закупки</a><a class="btn btn-secondary btn-sm" th:href="@{/projects/{id}/assemblies(id=${project.id})}">Разделы</a><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/items/new(id=${project.id})}">+ Добавить изделие</a></div></header><div th:replace="~{fragments/layout :: messages}"></div>
<form class="page-toolbar configuration-toolbar" method="get"><input class="form-control" name="search" th:value="${search}" placeholder="Обозначение, наименование, производитель или раздел"><select class="form-select" name="assemblyId" onchange="this.form.submit()"><option value="">Все разделы</option><option th:each="assembly:${assemblies}" th:value="${assembly.id}" th:selected="${assembly.id==assemblyId}" th:text="${assembly.name}"></option></select><select class="form-select" name="supplierId" onchange="this.form.submit()"><option value="">Все поставщики</option><option th:each="supplier:${suppliers}" th:value="${supplier.id}" th:selected="${supplier.id==supplierId}" th:text="${supplier.shortName?:supplier.name}"></option></select><button class="btn btn-secondary btn-sm">Найти</button><a class="btn btn-ghost btn-sm" th:href="@{/projects/{id}/configuration(id=${project.id})}">Сбросить</a></form>
<form id="procurement-selection" method="post" th:action="@{/projects/{id}/procurements/from-configuration(id=${project.id})}"><input type="hidden" name="filterSupplierId" th:value="${supplierId}"><input type="hidden" name="search" th:value="${search}"><input type="hidden" name="assemblyId" th:value="${assemblyId}"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><div class="procurement-create-panel"><div class="procurement-create-title">Создание закупки</div><div class="procurement-create-controls"><div><label class="form-label" for="procurement-supplier">Поставщик</label><select id="procurement-supplier" class="form-select" name="procurementSupplierId" required><option value="">Выберите поставщика</option><option th:each="supplier:${suppliers}" th:value="${supplier.id}" th:selected="${supplier.id==createSupplierId}" th:text="${supplier.shortName?:supplier.name}"></option></select></div><label class="form-check procurement-allow-unlisted"><input class="form-check-input" type="checkbox" name="allowUnlistedSupplier" value="true"><span class="form-check-label">Разрешить позиции без указанного поставщика</span></label><button id="create-procurement" class="btn btn-primary" disabled>Создать закупку</button></div></div></form>
<form id="act-selection" method="get" th:action="@{/transfer-acts/new}"><input type="hidden" name="projectId" th:value="${project.id}"><div class="selection-toolbar"><span>Для закупки выбирайте изделия, для акта — детализированные строки</span><button id="create-act" class="btn btn-secondary btn-sm" disabled>Создать акт</button></div></form>
<section class="content-card"><div class="table-responsive"><table class="table data-table configuration-table mb-0"><thead><tr><th></th><th>№</th><th>Обозначение</th><th>Наименование</th><th>Производитель</th><th>Поставщик</th><th>Количество</th><th>Ед.</th><th>Раздел</th><th>Закупка</th><th>Цех</th><th>Примечание</th><th>Действия</th></tr></thead>
<tbody th:each="item,stat:${items}"><tr class="data-row-clickable configuration-parent" th:classappend="${procurementProgress[item.id].cssClass}" th:attr="data-href=@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})},data-group=${item.id}"><td><input class="form-check-input procurement-check" type="checkbox" name="itemIds" th:value="${item.id}" form="procurement-selection"></td><td th:text="${stat.count}"></td><td><button class="btn btn-ghost btn-sm expand-row" type="button" th:attr="data-group=${item.id}">▸</button><span th:text="${item.catalogItem.designation?:'—'}"></span></td><td th:text="${item.catalogItem.name}"></td><td th:text="${item.catalogItem.manufacturer?:'—'}"></td><td th:text="${item.catalogItem.supplierSummary}"></td><td th:text="${item.requiredQuantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${item.catalogItem.unit}"></td><td th:text="${item.sectionSummary}"></td><td th:text="${procurementProgress[item.id].display}"></td><td><span th:if="${parentWorkshopTotal[item.id].signum()>0}" th:text="${'Передано: '+parentTransferred[item.id].stripTrailingZeros().toPlainString()}"></span><small class="cell-meta" th:if="${parentWorkshopTotal[item.id].signum()>0}" th:text="${'Требуется: '+parentWorkshopTotal[item.id].stripTrailingZeros().toPlainString()}"></small><span th:if="${parentWorkshopTotal[item.id].signum()==0}">—</span></td><td th:text="${item.notes?:'—'}"></td><td><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})}">Изм.</a></td></tr>
<tr class="allocation-child d-none" th:each="allocation:${item.allocations}" th:attr="data-group=${item.id}"><td><input th:if="${allocation.projectSubsection!=null}" class="form-check-input allocation-check" type="checkbox" name="allocationIds" th:value="${allocation.id}" form="act-selection" th:disabled="${remaining[allocation.id].signum()<=0}"></td><td></td><td colspan="3" class="ps-5"><span th:if="${allocation.projectSubsection!=null}" th:text="${allocation.projectSubsection.designation+(allocation.appliesFor!=null?' → '+allocation.appliesFor:'')}"></span></td><td></td><td th:text="${allocation.quantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${item.catalogItem.unit}"></td><td th:text="${allocation.projectAssembly!=null?allocation.projectAssembly.name:'Без раздела'}"></td><td></td><td><span th:if="${allocation.projectSubsection!=null}" th:text="${'Передано: '+transferred.getOrDefault(allocation.id,T(java.math.BigDecimal).ZERO).stripTrailingZeros().toPlainString()}"></span><small class="cell-meta" th:if="${allocation.projectSubsection!=null}" th:text="${'Требуется: '+allocation.quantity.stripTrailingZeros().toPlainString()}"></small><span th:if="${allocation.projectSubsection==null}">—</span></td><td th:text="${allocation.notes?:'—'}"></td><td></td></tr></tbody>
<tbody th:if="${#lists.isEmpty(items)}"><tr><td colspan="13"><div class="empty-state"><strong>Комплектация пока пуста</strong></div></td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script>const allocations=[...document.querySelectorAll('.allocation-check')],items=[...document.querySelectorAll('.procurement-check')],actButton=document.getElementById('create-act'),procurementButton=document.getElementById('create-procurement'),procurementSupplier=document.getElementById('procurement-supplier'),procurementForm=document.getElementById('procurement-selection');function update(){actButton.disabled=!allocations.some(c=>c.checked&&!c.disabled);procurementButton.disabled=!items.some(c=>c.checked)||!procurementSupplier.value}document.querySelectorAll('.expand-row').forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.allocation-child[data-group="'+b.dataset.group+'"]').forEach(r=>r.classList.toggle('d-none'));b.textContent=b.textContent==='▸'?'▾':'▸'});[...allocations,...items].forEach(c=>c.onchange=update);procurementSupplier.addEventListener('change',update);procurementForm.addEventListener('submit',()=>{procurementButton.disabled=true});update();</script></body></html>
