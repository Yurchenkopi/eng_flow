<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Комплектация')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-main"><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← К проекту</a><header class="page-header configuration-header"><div><h1 th:text="${project.designation}"></h1><p th:text="${project.name+(project.modificationName!=null?' / '+project.modificationName:'')}"></p><h2>Комплектация</h2></div><div class="header-actions"><a class="btn btn-outline-secondary btn-sm" th:href="@{/projects/{id}/assemblies(id=${project.id})}">Разделы</a><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/items/new(id=${project.id})}">+ Добавить изделие</a></div></header><div th:replace="~{fragments/layout :: messages}"></div>
<form class="toolbar" method="get"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><input class="form-control" name="search" th:value="${search}" placeholder="Поиск по изделию, разделу или примечанию"><select class="form-select" name="assemblyId" onchange="this.form.submit()"><option value="">Все разделы</option><option th:each="section:${assemblies}" th:value="${section.id}" th:selected="${section.id==assemblyId}" th:text="${section.name}"></option></select><button class="btn btn-outline-secondary btn-sm">Найти</button><a class="btn btn-link btn-sm" th:href="@{/projects/{id}/configuration(id=${project.id})}">Сбросить</a></form>
<form method="get" th:action="@{/transfer-acts/new}"><input type="hidden" name="projectId" th:value="${project.id}"><div class="selection-toolbar"><span>Выберите позиции для передачи в цех</span><button class="btn btn-primary btn-sm">Создать акт</button></div><section class="content-card"><div class="table-responsive"><table class="table data-table configuration-table mb-0"><thead><tr><th></th><th>№</th><th th:replace="~{project-items/sort-link :: header('designation','Обозначение')}"></th><th th:replace="~{project-items/sort-link :: header('name','Наименование')}"></th><th th:replace="~{project-items/sort-link :: header('manufacturer','Производитель')}"></th><th th:replace="~{project-items/sort-link :: header('quantity','Количество')}"></th><th>Ед.</th><th th:replace="~{project-items/sort-link :: header('assembly','Раздел')}"></th><th>Передано в цех</th><th>Примечание</th><th>Действия</th></tr></thead><tbody><tr th:each="item,stat:${items}"><td><input class="form-check-input" type="checkbox" name="itemIds" th:value="${item.id}"></td><td th:text="${stat.count}"></td><td th:text="${item.catalogItem.designation?:'—'}"></td><td th:text="${item.catalogItem.name}"></td><td th:text="${item.catalogItem.manufacturer?:'—'}"></td><td th:text="${item.requiredQuantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${item.catalogItem.unit}"></td><td th:text="${item.projectAssembly!=null?item.projectAssembly.name:'—'}"></td><td th:text="${transferred[item.id]!=null?transferred[item.id].stripTrailingZeros().toPlainString():'0'}"></td><td class="notes-cell" th:text="${item.notes?:'—'}"></td><td class="text-nowrap"><a class="btn btn-outline-secondary btn-sm" th:href="@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})}">Изм.</a><button class="btn btn-outline-danger btn-sm" type="submit" formmethod="post" th:formaction="@{/projects/{p}/items/{id}/delete(p=${project.id},id=${item.id})}" onclick="return confirm('Удалить позицию?')">×</button></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="11" class="empty-state">Позиции не найдены</td></tr></tbody></table></div></section></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
