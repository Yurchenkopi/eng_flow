<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Комплектация')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← К проекту</a><header class="page-header"><div><h1 class="page-title" th:text="${project.designation}"></h1><p class="page-subtitle" th:text="${project.name}"></p><h2 class="section-heading">Комплектация</h2></div><div class="header-actions"><a class="btn btn-secondary btn-sm" th:href="@{/projects/{id}/procurements(id=${project.id})}">Закупки</a><a class="btn btn-secondary btn-sm" th:href="@{/projects/{id}/assemblies(id=${project.id})}">Разделы</a><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/items/new(id=${project.id})}">+ Добавить изделие</a></div></header><div th:replace="~{fragments/layout :: messages}"></div>
<form class="page-toolbar" method="get"><input class="form-control" name="search" th:value="${search}" placeholder="Обозначение, наименование или производитель"><select class="form-select" name="assemblyId" onchange="this.form.submit()"><option value="">Все разделы</option><option th:each="assembly:${assemblies}" th:value="${assembly.id}" th:selected="${assembly.id==assemblyId}" th:text="${assembly.name}"></option></select><button class="btn btn-secondary btn-sm">Найти</button><a class="btn btn-ghost btn-sm" th:href="@{/projects/{id}/configuration(id=${project.id})}">Сбросить</a></form>
<form id="act-selection" method="get" th:action="@{/transfer-acts/new}"><input type="hidden" name="projectId" th:value="${project.id}"><div class="selection-toolbar"><span>Выберите детализированные позиции для передачи в цех</span><button id="create-act" class="btn btn-primary btn-sm" disabled>Создать акт</button></div><section class="content-card"><div class="table-responsive"><table class="table data-table configuration-table mb-0"><thead><tr><th></th><th>№</th><th>Обозначение</th><th>Наименование</th><th>Производитель</th><th>Поставщик</th><th>Количество</th><th>Ед.</th><th>Раздел</th><th>Закупка</th><th>Цех</th><th>Примечание</th><th>Действия</th></tr></thead>
<tbody th:each="item,stat:${items}"><tr class="data-row-clickable configuration-parent" th:classappend="${procurementProgress[item.id].cssClass}" th:attr="data-href=@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})},data-group=${item.id}"><td></td><td th:text="${stat.count}"></td><td><button class="btn btn-ghost btn-sm expand-row" type="button" th:attr="data-group=${item.id}">▸</button><span th:text="${item.catalogItem.designation?:'—'}"></span></td><td th:text="${item.catalogItem.name}"></td><td th:text="${item.catalogItem.manufacturer?:'—'}"></td><td th:text="${item.catalogItem.supplierSummary}"></td><td th:text="${item.requiredQuantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${item.catalogItem.unit}"></td><td th:text="${item.sectionSummary}"></td><td><span th:text="${procurementProgress[item.id].display}"></span><small class="cell-meta" th:if="${procurementProgress[item.id].requestedQuantity.signum()>0}" th:text="${'Запрошено: '+procurementProgress[item.id].requestedQuantity.stripTrailingZeros().toPlainString()}"></small></td><td th:text="${parentWorkshopTotal[item.id].signum()>0?parentTransferred[item.id].stripTrailingZeros().toPlainString()+' / '+parentWorkshopTotal[item.id].stripTrailingZeros().toPlainString():'—'}"></td><td th:text="${item.notes?:'—'}"></td><td><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})}">Изм.</a></td></tr>
<tr class="allocation-child d-none" th:each="allocation:${item.allocations}" th:attr="data-group=${item.id}"><td><input th:if="${allocation.projectSubsection!=null}" class="form-check-input allocation-check" type="checkbox" name="allocationIds" th:value="${allocation.id}" th:attr="data-group=${item.id}" th:disabled="${remaining[allocation.id].signum()<=0}"></td><td></td><td colspan="3" class="ps-5"><span th:if="${allocation.projectSubsection!=null}" th:text="${allocation.projectSubsection.designation+(allocation.appliesFor!=null?' → '+allocation.appliesFor:'')}"></span></td><td></td><td th:text="${allocation.quantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${item.catalogItem.unit}"></td><td th:text="${allocation.projectAssembly!=null?allocation.projectAssembly.name:'Без раздела'}"></td><td></td><td th:text="${allocation.projectSubsection!=null?transferred.getOrDefault(allocation.id,T(java.math.BigDecimal).ZERO).stripTrailingZeros().toPlainString()+' / '+allocation.quantity.stripTrailingZeros().toPlainString():'—'}"></td><td th:text="${allocation.notes?:'—'}"></td><td></td></tr></tbody>
<tbody th:if="${#lists.isEmpty(items)}"><tr><td colspan="13"><div class="empty-state"><strong>Комплектация пока пуста</strong></div></td></tr></tbody></table></div></section></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>const children=[...document.querySelectorAll('.allocation-check')],button=document.getElementById('create-act');function update(){button.disabled=!children.some(c=>c.checked&&!c.disabled)}document.querySelectorAll('.expand-row').forEach(b=>b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.allocation-child[data-group="'+b.dataset.group+'"]').forEach(r=>r.classList.toggle('d-none'));b.textContent=b.textContent==='▸'?'▾':'▸'});children.forEach(c=>c.onchange=update);update();</script></body></html>
