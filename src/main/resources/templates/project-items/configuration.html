<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Комплектация')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← К проекту</a><header class="page-header"><div><h1 class="page-title" th:text="${project.designation}"></h1><p class="page-subtitle" th:text="${project.name+(project.modificationName!=null?' · '+project.modificationName:'')}"></p><h2 class="section-heading">Комплектация</h2></div><div class="header-actions"><a class="btn btn-secondary btn-sm" th:href="@{/projects/{id}/assemblies(id=${project.id})}">Разделы</a><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/items/new(id=${project.id})}">+ Добавить изделие</a></div></header><div th:replace="~{fragments/layout :: messages}"></div><form class="page-toolbar" method="get"><input class="form-control" name="search" th:value="${search}" placeholder="Обозначение, наименование или производитель"><select class="form-select" name="assemblyId" onchange="this.form.submit()"><option value="">Все разделы</option><option th:each="assembly:${assemblies}" th:value="${assembly.id}" th:selected="${assembly.id==assemblyId}" th:text="${assembly.name}"></option></select><button class="btn btn-secondary btn-sm">Найти</button><a class="btn btn-ghost btn-sm" th:href="@{/projects/{id}/configuration(id=${project.id})}">Сбросить</a></form><form id="act-selection" method="get" th:action="@{/transfer-acts/new}"><input type="hidden" name="projectId" th:value="${project.id}"><div class="selection-toolbar"><span>Выберите позиции для передачи в цех</span><button id="create-act" class="btn btn-primary btn-sm" disabled>Создать акт</button></div><section class="content-card"><div class="table-responsive"><table class="table data-table configuration-table mb-0"><thead><tr><th></th><th>№</th><th th:replace="~{project-items/sort-link :: header('designation','Обозначение')}"></th><th th:replace="~{project-items/sort-link :: header('name','Наименование')}"></th><th th:replace="~{project-items/sort-link :: header('manufacturer','Производитель')}"></th><th th:replace="~{project-items/sort-link :: header('quantity','Количество')}"></th><th>Ед.</th><th th:replace="~{project-items/sort-link :: header('assembly','Раздел')}"></th><th>Передано в цех</th><th>Примечание</th><th>Действия</th></tr></thead><tbody><tr class="data-row-clickable" th:each="item,stat:${items}" th:attr="data-href=@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})}"><td><input class="form-check-input act-item-check" type="checkbox" name="itemIds" th:value="${item.id}" th:disabled="${remaining[item.id].signum()<=0}" th:title="${remaining[item.id].signum()<=0?'Все требуемое количество уже передано в цех':''}"></td><td th:text="${stat.count}"></td><td th:text="${item.catalogItem.designation?:'—'}"></td><td th:text="${item.catalogItem.name}"></td><td th:text="${item.catalogItem.manufacturer?:'—'}"></td><td th:text="${item.requiredQuantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${item.catalogItem.unit}"></td><td th:text="${item.projectAssembly!=null?item.projectAssembly.name:'—'}"></td><td><span th:text="${transferred[item.id]!=null?transferred[item.id].stripTrailingZeros().toPlainString():'0'}"></span><small class="cell-meta" th:text="${'Остаток: '+remaining[item.id].stripTrailingZeros().toPlainString()}"></small></td><td class="notes-cell" th:text="${item.notes?:'—'}"></td><td class="text-nowrap"><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})}">Изм.</a><button class="btn btn-ghost btn-sm text-danger" type="submit" formmethod="post" th:formaction="@{/projects/{p}/items/{id}/delete(p=${project.id},id=${item.id})}" onclick="return confirm('Удалить позицию?')">Удалить</button></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="11"><div class="empty-state"><strong>Комплектация пока пуста</strong><span>Добавьте первое изделие проекта.</span><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/items/new(id=${project.id})}">Добавить изделие</a></div></td></tr></tbody></table></div></section></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script>const checks=[...document.querySelectorAll('.act-item-check')],button=document.getElementById('create-act');function updateActButton(){button.disabled=!checks.some(check=>check.checked&&!check.disabled)}checks.forEach(check=>check.addEventListener('change',updateActButton));</script></body></html>
