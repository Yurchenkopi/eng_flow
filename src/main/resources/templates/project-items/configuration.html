<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Комплектация')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="container-fluid px-4 py-4"><a class="small text-decoration-none" th:href="@{/projects/{id}(id=${project.id})}">← Карточка проекта</a><div class="d-flex justify-content-between align-items-end my-2"><div class="page-heading"><h1 th:text="${project.designation}"></h1><p th:text="${project.name + (project.modificationName != null ? ' / ' + project.modificationName : '')}"></p><h2 class="configuration-title">Комплектация</h2></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary btn-sm" th:href="@{/projects/{id}/assemblies(id=${project.id})}">Разделы</a><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/items/new(id=${project.id})}">Добавить изделие</a></div></div><div th:replace="~{fragments/layout :: messages}"></div>
<form class="row g-2 mb-3" method="get"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><div class="col-lg-5"><input class="form-control" name="search" th:value="${search}" placeholder="Поиск по изделию, разделу или примечанию"></div><div class="col-lg-3"><select class="form-select" name="assemblyId"><option value="">Все разделы</option><option th:each="section : ${assemblies}" th:value="${section.id}" th:selected="${section.id == assemblyId}" th:text="${section.name}"></option></select></div><div class="col-auto"><button class="btn btn-outline-primary">Применить</button></div><div class="col-auto"><a class="btn btn-link" th:href="@{/projects/{id}/configuration(id=${project.id})}">Сбросить</a></div></form>
<section class="content-card"><div class="table-responsive"><table class="table app-table configuration-table mb-0"><thead><tr><th>№</th><th th:replace="~{project-items/sort-link :: header('designation','Обозначение')}"></th><th th:replace="~{project-items/sort-link :: header('name','Наименование')}"></th><th th:replace="~{project-items/sort-link :: header('manufacturer','Производитель')}"></th><th th:replace="~{project-items/sort-link :: header('quantity','Количество')}"></th><th>Ед.</th><th th:replace="~{project-items/sort-link :: header('assembly','Раздел')}"></th><th>Примечание</th><th>Действия</th></tr></thead><tbody><tr th:each="item,stat : ${items}"><td th:text="${stat.count}"></td><td th:text="${item.catalogItem.designation ?: '—'}"></td><td th:text="${item.catalogItem.name}"></td><td th:text="${item.catalogItem.manufacturer ?: '—'}"></td><td th:text="${item.requiredQuantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${item.catalogItem.unit}"></td><td th:text="${item.projectAssembly != null ? item.projectAssembly.name : '—'}"></td><td class="notes-cell" th:text="${item.notes ?: '—'}"></td><td class="text-nowrap"><a class="btn btn-outline-secondary btn-sm" th:href="@{/projects/{p}/items/{id}/edit(p=${project.id},id=${item.id})}">Изм.</a> <form class="d-inline" method="post" th:action="@{/projects/{p}/items/{id}/delete(p=${project.id},id=${item.id})}" onsubmit="return confirm('Удалить позицию из комплектации?')"><button class="btn btn-outline-danger btn-sm">×</button></form></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="9" class="empty-state">Позиции не найдены</td></tr></tbody></table></div></section></main><script th:replace="~{fragments/layout :: scripts}"></script></body></html>
