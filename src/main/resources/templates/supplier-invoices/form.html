<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container"><a class="back-link" th:href="@{/projects/{p}/procurements/{id}(p=${project.id},id=${procurement.id})}">← К закупке</a><header class="page-header"><h1 class="page-title" th:text="${pageTitle}"></h1></header><div th:replace="~{fragments/layout :: messages}"></div><form class="content-card form-card form-card-full" method="post" enctype="multipart/form-data" th:object="${invoice}" th:action="${invoice.id==null}?@{/projects/{p}/procurements/{pr}/invoices(p=${project.id},pr=${procurement.id})}:@{/projects/{p}/procurements/{pr}/invoices/{id}(p=${project.id},pr=${procurement.id},id=${invoice.id})}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Номер счета *</label><input class="form-control" th:field="*{invoiceNumber}" required></div><div class="col-md-3"><label class="form-label">Дата счета *</label><input class="form-control" type="date" th:field="*{invoiceDate}" required></div><div class="col-md-3"><label class="form-label">Передан в оплату</label><input class="form-control" type="date" th:field="*{paymentSubmittedDate}"></div><div class="col-md-8"><label class="form-label">Файл счета</label><input class="form-control" type="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.xls,.xlsx"><div class="form-text" th:if="${invoice.fileOriginalName!=null}" th:text="${'Сейчас прикреплен: '+invoice.fileOriginalName}"></div></div><div class="col-12"><label class="form-label">Примечание</label><textarea class="form-control" rows="4" th:field="*{notes}"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">Сохранить счет</button><a class="btn btn-outline-secondary" th:href="@{/projects/{p}/procurements/{id}(p=${project.id},id=${procurement.id})}">Отмена</a></div></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
