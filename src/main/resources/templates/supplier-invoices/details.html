<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Счет поставщика')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{p}/procurements/{id}(p=${project.id},id=${procurement.id})}">← К закупке</a><header class="page-header"><div><h1 class="page-title" th:text="${'Счет № '+invoice.invoiceNumber}"></h1><p class="page-subtitle" th:text="${procurement.supplier.shortName?:procurement.supplier.name}"></p></div><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/procurements/{pr}/invoices/{id}/edit(p=${project.id},pr=${procurement.id},id=${invoice.id})}">Редактировать</a></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card details-card mb-3"><dl class="row detail-list mb-0"><dt class="col-sm-3">Дата счета</dt><dd class="col-sm-9" th:text="${#temporals.format(invoice.invoiceDate,'dd.MM.yyyy')}"></dd><dt class="col-sm-3">Передан в оплату</dt><dd class="col-sm-9" th:text="${invoice.paymentSubmittedDate!=null?#temporals.format(invoice.paymentSubmittedDate,'dd.MM.yyyy'):'Нет'}"></dd><dt class="col-sm-3">Файл</dt><dd class="col-sm-9"><span th:if="${!invoice.hasFile()}">—</span><span th:if="${invoice.hasFile()}"><a th:href="@{/projects/{p}/procurements/{pr}/invoices/{id}/file(p=${project.id},pr=${procurement.id},id=${invoice.id})}" th:text="${invoice.fileOriginalName}"></a><form class="d-inline ms-2" method="post" th:action="@{/projects/{p}/procurements/{pr}/invoices/{id}/file/delete(p=${project.id},pr=${procurement.id},id=${invoice.id})}" onsubmit="return confirm('Удалить прикрепленный файл?')"><button class="btn btn-ghost btn-sm text-danger">Удалить файл</button></form></span></dd><dt class="col-sm-3">Примечание</dt><dd class="col-sm-9" th:text="${invoice.notes?:'—'}"></dd></dl><form class="mt-3" th:if="${invoice.paymentSubmittedDate==null}" method="post" th:action="@{/projects/{p}/procurements/{pr}/invoices/{id}/submit-payment(p=${project.id},pr=${procurement.id},id=${invoice.id})}" onsubmit="return confirm('Отметить счет переданным в оплату?')"><button class="btn btn-primary">Передать в оплату</button></form></section><section class="content-card"><div class="content-card-header"><h2>Позиции счета</h2></div><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>Позиция</th><th>Количество</th><th>Ед.</th><th>Цена за единицу</th><th>Примечание</th></tr></thead><tbody><tr th:each="line:${invoiceLines}"><td><strong th:text="${line.procurementLine.projectItem.catalogItem.designation?:'—'}"></strong><small class="cell-meta" th:text="${line.procurementLine.projectItem.catalogItem.name}"></small></td><td th:text="${line.quantity.stripTrailingZeros().toPlainString()}"></td><td th:text="${line.procurementLine.projectItem.catalogItem.unit}"></td><td th:text="${line.unitPrice!=null?line.unitPrice.stripTrailingZeros().toPlainString():'—'}"></td><td th:text="${line.notes?:'—'}"></td></tr><tr th:if="${#lists.isEmpty(invoiceLines)}"><td colspan="5"><div class="empty-state">Позиции счета пока не добавлены</div></td></tr></tbody></table></div><form class="supplier-editor" method="post" th:object="${newLine}" th:action="@{/projects/{p}/procurements/{pr}/invoices/{id}/lines(p=${project.id},pr=${procurement.id},id=${invoice.id})}"><div><label class="form-label">Позиция закупки</label><select class="form-select" th:field="*{procurementLine.id}" required><option value="">Выберите позицию</option><option th:each="line:${procurementLines}" th:value="${line.id}" th:text="${(line.projectItem.catalogItem.designation?:'')+' — '+line.projectItem.catalogItem.name+' · запрошено '+line.requestedQuantity.stripTrailingZeros().toPlainString()}"></option></select></div><div><label class="form-label">Количество</label><input class="form-control" type="number" min="0.0001" step="0.0001" th:field="*{quantity}" required></div><div><label class="form-label">Цена за единицу</label><input class="form-control" type="number" min="0" step="0.01" th:field="*{unitPrice}"></div><div><label class="form-label">Примечание</label><input class="form-control" th:field="*{notes}"></div><div class="align-self-end"><button class="btn btn-primary btn-sm">Добавить в счет</button></div></form></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
