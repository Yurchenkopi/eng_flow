<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navigation(activePage)" class="navbar navbar-expand-lg app-header">
    <div class="app-header-inner">
        <a class="navbar-brand fw-semibold" th:href="@{/}">EngFlow</a>
        <div class="navbar-nav">
            <a class="nav-link" th:classappend="${activePage == 'home'} ? ' active'" th:href="@{/}">Главная</a>
            <a class="nav-link" th:classappend="${activePage == 'projects'} ? ' active'" th:href="@{/projects}">Проекты</a>
            <a class="nav-link" th:classappend="${activePage == 'catalog-items'} ? ' active'" th:href="@{/catalog-items}">Изделия</a>
            <a class="nav-link" th:classappend="${activePage == 'organizations'} ? ' active'" th:href="@{/organizations}">Организации</a>
            <a class="nav-link" th:classappend="${activePage == 'transfer-acts'} ? ' active'" th:href="@{/transfer-acts}">Акты</a>
        </div>
    </div>
</nav>

<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title + ' — EngFlow'}">EngFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</th:block>

<div th:fragment="messages" class="flash-stack" th:if="${successMessage != null or errorMessage != null}">
    <div class="flash-message flash-success" th:if="${successMessage}" role="status" th:text="${successMessage}"></div>
    <div class="flash-message flash-error" th:if="${errorMessage}" role="alert" th:text="${errorMessage}"></div>
</div>

<th:block th:fragment="scripts"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script>document.addEventListener('click',event=>{const row=event.target.closest('.data-row-clickable,[data-href].clickable-row');if(row&&row.dataset.href&&!event.target.closest('a,button,input,select,textarea,label,[data-no-row-click]'))window.location.href=row.dataset.href;});</script></th:block>
</body>
</html>
