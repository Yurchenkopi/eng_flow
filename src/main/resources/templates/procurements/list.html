<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Закупки')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← К проекту</a><header class="page-header"><div><h1 class="page-title">Закупки</h1><p class="page-subtitle" th:text="${project.designation+' — '+project.name}"></p></div><div class="d-flex gap-2"><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/procurements/new(id=${project.id})}">+ Создать закупку</a><button id="delete-procurements" class="btn btn-outline-danger btn-sm" type="submit" form="procurement-delete-selection" disabled>Удалить</button></div></header><div th:replace="~{fragments/layout :: messages}"></div><form id="procurement-delete-selection" method="post" th:action="@{/projects/{id}/procurements/delete-selected(id=${project.id})}" onsubmit="return confirm('Удалить выбранные закупки?')"></form><section class="content-card"><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th></th><th>Номер</th><th>Поставщик</th><th>Запрос отправлен</th><th>Позиций</th><th>Счетов</th><th>Статус</th><th>Примечание</th><th></th></tr></thead><tbody><tr class="data-row-clickable" th:each="procurement:${procurements}" th:attr="data-href=@{/projects/{p}/procurements/{id}(p=${project.id},id=${procurement.id})}"><td class="selection-cell" data-no-row-click><input class="form-check-input procurement-delete-check" type="checkbox" name="procurementIds" th:value="${procurement.id}" form="procurement-delete-selection"></td><td class="fw-semibold" th:text="${procurement.displayNumber}"></td><td th:text="${procurement.supplier.shortName?:procurement.supplier.name}"></td><td th:text="${procurement.rfqSentAt!=null?#temporals.format(procurement.rfqSentAt,'dd.MM.yyyy HH:mm'):'—'}"></td><td th:text="${lineCounts[procurement.id]}"></td><td th:text="${invoiceCounts[procurement.id]}"></td><td><span class="status-badge" th:classappend="${' status-'+#strings.toLowerCase(statuses[procurement.id].name()).replace('_','-')}" th:text="${statuses[procurement.id].displayName}"></span></td><td th:text="${procurement.notes?:'—'}"></td><td><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/procurements/{id}(p=${project.id},id=${procurement.id})}">Открыть</a></td></tr><tr th:if="${#lists.isEmpty(procurements)}"><td colspan="9"><div class="empty-state">Закупки пока не созданы</div></td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script>const procurementDeleteChecks=[...document.querySelectorAll('.procurement-delete-check')],procurementDeleteButton=document.getElementById('delete-procurements'),procurementDeleteForm=document.getElementById('procurement-delete-selection');function updateProcurementDeleteButton(){procurementDeleteButton.disabled=!procurementDeleteChecks.some(checkbox=>checkbox.checked)}procurementDeleteChecks.forEach(checkbox=>checkbox.addEventListener('change',updateProcurementDeleteButton));procurementDeleteForm.addEventListener('submit',event=>{if(!procurementDeleteChecks.some(checkbox=>checkbox.checked)){event.preventDefault();return}procurementDeleteButton.disabled=true});updateProcurementDeleteButton();</script></body></html>
