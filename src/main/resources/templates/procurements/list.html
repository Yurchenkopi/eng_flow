<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Закупки')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← К проекту</a><header class="page-header"><div><h1 class="page-title">Закупки</h1><p class="page-subtitle" th:text="${project.designation+' — '+project.name}"></p></div><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/procurements/new(id=${project.id})}">+ Создать закупку</a></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card"><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>Поставщик</th><th>Запрос отправлен</th><th>Позиций</th><th>Счетов</th><th>Статус</th><th>Примечание</th><th></th></tr></thead><tbody><tr th:each="procurement:${procurements}"><td th:text="${procurement.supplier.shortName?:procurement.supplier.name}"></td><td th:text="${procurement.rfqSentAt!=null?#temporals.format(procurement.rfqSentAt,'dd.MM.yyyy HH:mm'):'—'}"></td><td th:text="${lineCounts[procurement.id]}"></td><td th:text="${invoiceCounts[procurement.id]}"></td><td><span class="status-badge" th:classappend="${' status-'+#strings.toLowerCase(statuses[procurement.id].name()).replace('_','-')}" th:text="${statuses[procurement.id].displayName}"></span></td><td th:text="${procurement.notes?:'—'}"></td><td><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/procurements/{id}(p=${project.id},id=${procurement.id})}">Открыть</a></td></tr><tr th:if="${#lists.isEmpty(procurements)}"><td colspan="7"><div class="empty-state">Закупки пока не созданы</div></td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
