<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Новая закупка')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide"><a class="back-link" th:href="@{/projects/{id}/configuration(id=${project.id})}">← К комплектации</a><header class="page-header"><div><h1 class="page-title">Новая закупка</h1><p class="page-subtitle" th:text="${'Поставщик: '+(supplier.shortName?:supplier.name)}"></p></div></header><div th:replace="~{fragments/layout :: messages}"></div><form class="content-card" method="post" th:action="@{/projects/{id}/procurements/from-configuration(id=${project.id})}"><input type="hidden" name="procurementSupplierId" th:value="${supplier.id}"><input type="hidden" name="allowUnlistedSupplier" th:value="${allowUnlistedSupplier}"><div class="content-card-header"><h2>Позиции закупки</h2><small>Закупка еще не сохранена. Проверьте количества и подтвердите создание.</small></div><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>Изделие</th><th>Доступно к закупке</th><th>Количество</th><th>Ед.</th></tr></thead><tbody><tr th:each="item:${items}"><td><input type="hidden" name="itemIds" th:value="${item.id}"><strong th:text="${item.catalogItem.designation?:'—'}"></strong><small class="cell-meta" th:text="${item.catalogItem.name}"></small></td><td th:text="${remaining[item.id].stripTrailingZeros().toPlainString()}"></td><td><input class="form-control procurement-draft-quantity" type="number" name="requestedQuantities" th:min="${item.catalogItem.quantityStep}" th:step="${item.catalogItem.quantityStep}" th:max="${remaining[item.id]}" th:value="${remaining[item.id].stripTrailingZeros().toPlainString()}" required></td><td th:text="${item.catalogItem.unit}"></td></tr></tbody></table></div><div class="form-actions px-3 pb-3"><button class="btn btn-primary">Создать закупку</button><a class="btn btn-outline-secondary" th:href="@{/projects/{id}/configuration(id=${project.id})}">Отмена</a></div></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
