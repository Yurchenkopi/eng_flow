<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container"><a class="back-link" th:href="@{/projects/{id}/procurements(id=${project.id})}">← К закупкам</a><header class="page-header"><h1 class="page-title" th:text="${pageTitle}"></h1></header><div th:replace="~{fragments/layout :: messages}"></div><form class="content-card form-card form-card-full" method="post" th:object="${procurement}" th:action="${procurement.id==null}?@{/projects/{p}/procurements(p=${project.id})}:@{/projects/{p}/procurements/{id}(p=${project.id},id=${procurement.id})}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Поставщик *</label><select class="form-select" th:field="*{supplier.id}" required><option value="">Выберите поставщика</option><option th:each="supplier:${suppliers}" th:value="${supplier.id}" th:text="${supplier.shortName?:supplier.name}"></option></select></div><div class="col-12"><label class="form-label">Примечание</label><textarea class="form-control" rows="4" th:field="*{notes}"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">Сохранить закупку</button><a class="btn btn-outline-secondary" th:href="@{/projects/{id}/procurements(id=${project.id})}">Отмена</a></div></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
