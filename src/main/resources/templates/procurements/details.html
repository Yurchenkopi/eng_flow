<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Закупка')}"></head><body>
<nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container-wide">
<a class="back-link" th:href="@{/projects/{id}/procurements(id=${project.id})}">← К закупкам</a>
<header class="page-header"><div><h1 class="page-title" th:text="${procurement.displayNumber}"></h1><p class="page-subtitle" th:text="${procurement.supplier.shortName?:procurement.supplier.name}"></p></div><div class="header-actions"><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/procurements/{id}/edit(p=${project.id},id=${procurement.id})}">Редактировать</a><a class="btn btn-primary btn-sm" th:href="@{/projects/{p}/procurements/{id}/invoices/new(p=${project.id},id=${procurement.id})}">+ Добавить счет</a></div></header>
<div th:replace="~{fragments/layout :: messages}"></div>
<form class="mb-3" method="post" th:action="@{/projects/{p}/procurements/{id}/delete(p=${project.id},id=${procurement.id})}" onsubmit="return confirm('Удалить закупку? Позиции комплектации останутся без изменений.')"><button class="btn btn-outline-danger">Удалить закупку</button></form>
<section class="content-card details-card mb-3"><div class="d-flex justify-content-between align-items-center"><div><span class="status-badge" th:text="${status.displayName}"></span><span class="ms-2" th:text="${procurement.rfqSentAt!=null?'Запрос отправлен '+#temporals.format(procurement.rfqSentAt,'dd.MM.yyyy HH:mm'):'Запрос еще не отправлен'}"></span></div><form th:if="${procurement.rfqSentAt==null}" method="post" th:action="@{/projects/{p}/procurements/{id}/rfq-sent(p=${project.id},id=${procurement.id})}"><button class="btn btn-secondary btn-sm">Отметить запрос отправленным</button></form></div></section>
<section class="content-card mb-3"><div class="content-card-header"><h2>Позиции закупки</h2></div><div class="table-responsive"><table class="table data-table mb-0">
<thead><tr><th>Изделие</th><th>Количество</th><th>Ед.</th><th>Возможные поставщики</th><th>Примечание</th></tr></thead><tbody>
<tr th:each="line:${procurementLines}"><td><strong th:text="${line.projectItem.catalogItem.designation?:'—'}"></strong><small class="cell-meta" th:text="${line.projectItem.catalogItem.name}"></small></td><td><form th:if="${lineEditable[line.id]}" class="procurement-quantity-editor" method="post" th:action="@{/projects/{p}/procurements/{id}/lines/{lineId}/quantity(p=${project.id},id=${procurement.id},lineId=${line.id})}"><input class="form-control form-control-sm" type="number" name="requestedQuantity" min="0.0001" step="0.0001" th:max="${lineMax[line.id]}" th:value="${line.requestedQuantity.stripTrailingZeros().toPlainString()}" required><button class="btn btn-secondary btn-sm">Сохранить</button><small class="cell-meta" th:text="${'Макс.: '+lineMax[line.id].stripTrailingZeros().toPlainString()}"></small></form><span th:unless="${lineEditable[line.id]}" th:text="${line.requestedQuantity.stripTrailingZeros().toPlainString()}"></span></td><td th:text="${line.projectItem.catalogItem.unit}"></td><td th:text="${line.projectItem.catalogItem.supplierSummary}"></td><td th:text="${line.notes?:'—'}"></td></tr>
<tr th:if="${#lists.isEmpty(procurementLines)}"><td colspan="5"><div class="empty-state">Позиции пока не добавлены</div></td></tr></tbody></table></div>
<form class="supplier-editor" method="post" th:object="${newLine}" th:action="@{/projects/{p}/procurements/{id}/lines(p=${project.id},id=${procurement.id})}"><div><label class="form-label">Позиция комплектации</label><select id="new-procurement-item" class="form-select" th:field="*{projectItem.id}" required><option value="">Выберите позицию</option><option th:each="item:${projectItems}" th:if="${remainingToPlan[item.id].signum()>0}" th:value="${item.id}" th:attr="data-remaining=${remainingToPlan[item.id]}" th:text="${(item.catalogItem.designation?:'')+' — '+item.catalogItem.name+' · остаток '+remainingToPlan[item.id].stripTrailingZeros().toPlainString()+' '+item.catalogItem.unit}"></option></select></div><div><label class="form-label">Количество</label><input id="new-procurement-quantity" class="form-control" type="number" min="0.0001" step="0.0001" th:field="*{requestedQuantity}" required></div><div><label class="form-label">Примечание</label><input class="form-control" th:field="*{notes}"></div><div class="align-self-end"><button class="btn btn-primary btn-sm">Добавить позицию</button></div></form></section>
<section class="content-card"><div class="content-card-header"><h2>Счета поставщика</h2></div><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>Номер</th><th>Дата</th><th>Передан в оплату</th><th>Файл</th><th></th></tr></thead><tbody><tr th:each="invoice:${invoices}"><td th:text="${invoice.invoiceNumber}"></td><td th:text="${#temporals.format(invoice.invoiceDate,'dd.MM.yyyy')}"></td><td th:text="${invoice.paymentSubmittedDate!=null?#temporals.format(invoice.paymentSubmittedDate,'dd.MM.yyyy'):'Нет'}"></td><td th:text="${invoice.fileOriginalName?:'—'}"></td><td><a class="btn btn-secondary btn-sm" th:href="@{/projects/{p}/procurements/{pr}/invoices/{id}(p=${project.id},pr=${procurement.id},id=${invoice.id})}">Открыть</a></td></tr><tr th:if="${#lists.isEmpty(invoices)}"><td colspan="5"><div class="empty-state">Счета пока не добавлены</div></td></tr></tbody></table></div></section>
</main><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script>const quantityStep=unit=>unit.trim().toLowerCase()==='шт.'?'1':['кг','м'].includes(unit.trim().toLowerCase())?'0.1':'0.0001';document.querySelectorAll('.procurement-quantity-editor input').forEach(input=>{const step=quantityStep(input.closest('tr').children[2].textContent);input.step=step;input.min=step});const itemSelect=document.getElementById('new-procurement-item'),quantityInput=document.getElementById('new-procurement-quantity');itemSelect?.addEventListener('change',()=>{const option=itemSelect.selectedOptions[0],remaining=option?.dataset.remaining||'',step=quantityStep(option?.textContent.trim().split(' ').pop()||'');quantityInput.value=remaining;quantityInput.max=remaining;quantityInput.step=step;quantityInput.min=step});</script></body></html>
