<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: navigation('organizations')}"></nav><main class="app-main"><header class="page-header"><div><h1 th:text="${pageTitle}"></h1><p>Реквизиты, роли и контакты</p></div></header><div th:replace="~{fragments/layout :: messages}"></div><form class="content-card form-card" th:object="${organization}" th:action="${organization.id==null}?@{/organizations}:@{/organizations/{id}(id=${organization.id})}" method="post"><div class="form-section"><h2>Основные сведения</h2><div class="row g-3"><div class="col-lg-8"><label class="form-label">Наименование *</label><input class="form-control" th:field="*{name}"><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-lg-4"><label class="form-label">Краткое наименование</label><input class="form-control" th:field="*{shortName}"></div><div class="col-lg-4"><label class="form-label">ИНН</label><input class="form-control" th:field="*{inn}"></div><div class="col-lg-8"><label class="form-label d-block">Роли</label><div class="form-check form-check-inline" th:each="role:${availableRoles}"><input class="form-check-input" type="checkbox" th:field="*{roles}" th:value="${role}"><label class="form-check-label" th:for="${#ids.prev('roles')}" th:text="${role.displayName}"></label></div></div><div class="col-12"><label class="form-label">Примечания</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div></div><div class="form-actions"><button class="btn btn-primary btn-sm">Сохранить</button><a class="btn btn-outline-secondary btn-sm" th:href="@{/organizations}">Отмена</a></div></form>
<section id="contacts" class="content-card mt-3" th:if="${organization.id!=null}"><div class="content-card-header"><h2>Контакты</h2><a class="btn btn-outline-primary btn-sm" th:href="@{/organizations/{id}/contacts/new(id=${organization.id})}">Добавить контакт</a></div><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>ФИО</th><th>Должность</th><th>Email</th><th>Телефон</th><th></th></tr></thead><tbody><tr th:each="contact:${contacts}"><td><span th:text="${contact.fullName}"></span> <span class="role-badge" th:if="${contact.primary}">Основной</span></td><td th:text="${contact.position?:'—'}"></td><td th:text="${contact.email?:'—'}"></td><td th:text="${contact.phone?:'—'}"></td><td class="text-end"><a class="btn btn-outline-secondary btn-sm" th:href="@{/organizations/{o}/contacts/{id}/edit(o=${organization.id},id=${contact.id})}">Изм.</a></td></tr><tr th:if="${#lists.isEmpty(contacts)}"><td colspan="5" class="empty-state">Контактов пока нет</td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
