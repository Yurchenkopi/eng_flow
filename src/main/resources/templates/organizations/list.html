<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Организации')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation('organizations')}"></nav>
<main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div class="page-heading"><h1>Организации</h1><p>Заказчики и поставщики</p></div>
        <a class="btn btn-primary" th:href="@{/organizations/new}">Новая организация</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <section class="content-card">
        <div class="table-responsive">
            <table class="table table-sm app-table mb-0 align-middle">
                <thead><tr><th>Наименование</th><th>Краткое наименование</th><th>ИНН</th><th>Примечания</th><th></th></tr></thead>
                <tbody>
                <tr th:each="organization : ${organizations}">
                    <td class="fw-semibold" th:text="${organization.name}"></td>
                    <td th:text="${organization.shortName ?: '—'}"></td>
                    <td th:text="${organization.inn ?: '—'}"></td>
                    <td class="text-truncate notes-cell" th:text="${organization.notes ?: '—'}"></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/organizations/{id}/edit(id=${organization.id})}">Изменить</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(organizations)}"><td colspan="5" class="empty-state">Организации пока не созданы</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
