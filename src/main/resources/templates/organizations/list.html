<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Организации')}"></head><body><nav th:replace="~{fragments/layout :: navigation('organizations')}"></nav><main class="app-main"><header class="page-header"><div><h1>Организации</h1><p>Заказчики, поставщики и контакты</p></div><a class="btn btn-primary btn-sm" th:href="@{/organizations/new}">Новая организация</a></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card"><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>Наименование</th><th>Краткое</th><th>ИНН</th><th>Роли</th><th>Примечания</th></tr></thead><tbody><tr class="clickable-row" th:each="organization:${organizations}" th:attr="data-href=@{/organizations/{id}/edit(id=${organization.id})}"><td class="fw-semibold" th:text="${organization.name}"></td><td th:text="${organization.shortName?:'—'}"></td><td th:text="${organization.inn?:'—'}"></td><td><span class="role-badge" th:each="role:${organization.roles}" th:text="${role.displayName}"></span></td><td class="notes-cell" th:text="${organization.notes?:'—'}"></td></tr><tr th:if="${#lists.isEmpty(organizations)}"><td colspan="5" class="empty-state">Организации пока не созданы</td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
