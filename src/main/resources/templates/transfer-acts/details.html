<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${act.displayNumber})}"></head><body><nav th:replace="~{fragments/layout :: navigation('transfer-acts')}"></nav><main class="app-main"><a class="back-link" th:href="@{/transfer-acts}">← К актам</a><article class="document-preview"><h1>Акт приема-передачи № <span th:text="${act.displayNumber}"></span></h1><p class="text-center" th:text="${act.project.designation+' — '+act.project.name}"></p><table class="table document-table"><thead><tr><th>№</th><th>Обозначение</th><th>Наименование</th><th>Куда входит</th><th>Цеховой номер</th><th>Количество</th><th>Всего</th></tr></thead><tbody><tr th:each="line,stat:${act.items}"><td th:text="${stat.count}"></td><td th:text="${line.projectItem.catalogItem.designation?:'—'}"></td><td th:text="${line.projectItem.catalogItem.name}"></td><td th:text="${line.destinationDesignation?:'—'}"></td><td th:text="${line.shopNumber?:'—'}"></td><td th:text="${line.quantity.stripTrailingZeros().toPlainString()+' '+line.projectItem.catalogItem.unit}"></td><td th:text="${line.totalSameCatalogItem.stripTrailingZeros().toPlainString()+' '+line.projectItem.catalogItem.unit}"></td></tr></tbody></table><p>Дата: <span th:text="${#temporals.format(act.actDate,'dd.MM.yyyy')}"></span></p><div class="signature-grid"><p>Сдал __________________ <span th:text="${act.deliveredBy}"></span></p><p>Принял ________________ <span th:text="${act.receivedBy}"></span></p></div><p class="preserve-lines" th:if="${act.notes}" th:text="${act.notes}"></p></article></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
