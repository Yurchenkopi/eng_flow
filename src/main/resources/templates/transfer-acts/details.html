<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${act.displayNumber})}"></head><body><nav th:replace="~{fragments/layout :: navigation('transfer-acts')}"></nav><main class="app-container"><a class="back-link" th:href="@{/transfer-acts}">← К актам</a><header class="page-header"><div><h1 class="page-title">Акт приема-передачи № <span th:text="${act.displayNumber}"></span></h1><p class="page-subtitle"><span class="status-badge" th:classappend="${act.transferred}?' status-transferred':' status-draft'" th:text="${act.transferred}?'Передано':'Черновик'"></span></p></div><div class="header-actions" th:unless="${act.transferred}"><a class="btn btn-secondary btn-sm" th:href="@{/transfer-acts/{id}/edit(id=${act.id})}">Редактировать</a><form method="post" th:action="@{/transfer-acts/{id}/delete(id=${act.id})}" onsubmit="return confirm('Удалить черновик акта?')"><button class="btn btn-danger btn-sm">Удалить</button></form><form method="post" th:action="@{/transfer-acts/{id}/finalize(id=${act.id})}" onsubmit="return confirm('После подтверждения акт нельзя будет изменить или удалить. Отметить изделия как переданные в цех?')"><button class="btn btn-primary btn-sm" th:disabled="${#lists.isEmpty(act.items)}">Отметить как передано</button></form></div></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card details-card"><dl class="detail-list detail-grid"><dt>Дата</dt><dd th:text="${#temporals.format(act.actDate,'dd.MM.yyyy')}"></dd><dt>Проект</dt><dd><a th:href="@{/projects/{id}(id=${act.project.id})}" th:text="${act.project.designation+' — '+act.project.name}"></a></dd><dt>Сдал</dt><dd th:text="${act.deliveredBy}"></dd><dt>Принял</dt><dd th:text="${act.receivedBy}"></dd><dt>Примечание</dt><dd class="preserve-lines" th:text="${act.notes?:'—'}"></dd></dl></section><section class="content-card mt-3"><div class="content-card-header"><h2>Позиции</h2></div><div class="table-responsive" th:unless="${#lists.isEmpty(act.items)}"><table class="table data-table mb-0"><thead><tr><th>№</th><th>Обозначение</th><th>Наименование</th><th>Куда входит</th><th>Цеховой номер</th><th>Количество</th><th>Всего</th><th th:unless="${act.transferred}">Действия</th></tr></thead><tbody><tr th:each="line,stat:${act.items}"><td th:text="${stat.count}"></td><td th:text="${line.projectItem.catalogItem.designation?:'—'}"></td><td th:text="${line.projectItem.catalogItem.name}"></td><td th:text="${line.destinationDesignation?:'—'}"></td><td th:text="${line.shopNumber?:'—'}"></td><td th:text="${line.quantity.stripTrailingZeros().toPlainString()+' '+line.projectItem.catalogItem.unit}"></td><td th:text="${line.totalSameCatalogItem.stripTrailingZeros().toPlainString()+' '+line.projectItem.catalogItem.unit}"></td><td th:unless="${act.transferred}"><form method="post" th:action="@{/transfer-acts/{id}/items/{itemId}/delete(id=${act.id},itemId=${line.id})}" onsubmit="return confirm('Удалить позицию из акта?')"><button class="btn btn-ghost btn-sm">Удалить</button></form></td></tr></tbody></table></div><div class="empty-state" th:if="${#lists.isEmpty(act.items)}"><strong>В акте пока нет позиций</strong><span>Можно удалить пустой черновик акта.</span></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
