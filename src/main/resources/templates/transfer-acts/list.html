<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Акты')}"></head><body><nav th:replace="~{fragments/layout :: navigation('transfer-acts')}"></nav><main class="app-main"><header class="page-header"><div><h1>Акты</h1><p>Прием-передача изделий в цех</p></div></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card"><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>№</th><th>Дата</th><th>Проект</th><th>Сдал</th><th>Принял</th><th>Строк</th></tr></thead><tbody><tr class="clickable-row" th:each="act:${acts}" th:attr="data-href=@{/transfer-acts/{id}(id=${act.id})}"><td class="fw-semibold" th:text="${act.displayNumber}"></td><td th:text="${#temporals.format(act.actDate,'dd.MM.yyyy')}"></td><td th:text="${act.project.designation}"></td><td th:text="${act.deliveredBy}"></td><td th:text="${act.receivedBy}"></td><td th:text="${#lists.size(act.items)}"></td></tr><tr th:if="${#lists.isEmpty(acts)}"><td colspan="6" class="empty-state">Акты пока не созданы</td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
