<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Акты')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container"><a class="back-link" th:href="@{/projects/{id}(id=${project.id})}">← К проекту</a><header class="page-header"><div><h1 class="page-title">Акты</h1><p class="page-subtitle" th:text="${project.designation+' — '+project.name}"></p></div></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card"><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>№</th><th>Дата</th><th>Статус</th><th>Сдал</th><th>Принял</th><th>Строк</th></tr></thead><tbody><tr class="data-row-clickable" th:each="act:${acts}" th:attr="data-href=@{/transfer-acts/{id}(id=${act.id})}"><td class="fw-semibold" th:text="${act.displayNumber}"></td><td th:text="${#temporals.format(act.actDate,'dd.MM.yyyy')}"></td><td><span class="status-badge" th:classappend="${act.transferred}?' status-transferred':' status-draft'" th:text="${act.transferred}?'Передано':'Черновик'"></span></td><td th:text="${act.deliveredBy}"></td><td th:text="${act.receivedBy}"></td><td th:text="${#lists.size(act.items)}"></td></tr><tr th:if="${#lists.isEmpty(acts)}"><td colspan="6"><div class="empty-state"><strong>Акты еще не созданы</strong><span>Акты приема-передачи создаются из комплектации проекта.</span></div></td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
