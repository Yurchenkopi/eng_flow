<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editing?'Редактирование акта':'Новый акт'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation('transfer-acts')}"></nav>
<main class="app-container">
    <a class="back-link" th:href="${editing}?@{/transfer-acts/{id}(id=${transferAct.id})}:@{/projects/{id}/configuration(id=${transferAct.project.id})}">← Назад</a>
    <header class="page-header"><div><h1 class="page-title" th:text="${editing?'Редактирование акта № '+transferAct.displayNumber:'Новый акт приема-передачи'}"></h1><p class="page-subtitle" th:text="${transferAct.project.designation+' — '+transferAct.project.name}"></p></div></header>
    <form class="content-card form-card form-card-wide" method="post" th:object="${transferAct}" th:action="${editing}?@{/transfer-acts/{id}(id=${transferAct.id})}:@{/transfer-acts}">
        <input type="hidden" th:field="*{project.id}">
        <input type="hidden" th:field="*{id}">
        <div class="flash-message flash-error" th:if="${#fields.hasGlobalErrors()}" th:each="error:${#fields.globalErrors()}" th:text="${error}"></div>
        <div class="form-section"><div class="form-grid">
            <div><label class="form-label">Дата *</label><input class="form-control" type="date" th:field="*{actDate}"></div>
            <div><label class="form-label">Сдал *</label><input class="form-control" th:field="*{deliveredBy}"></div>
            <div><label class="form-label">Принял *</label><input class="form-control" th:field="*{receivedBy}"></div>
            <div class="form-grid-full"><label class="form-label">Примечание</label><textarea class="form-control" rows="2" th:field="*{notes}"></textarea></div>
        </div></div>
        <div class="form-section"><h2>Позиции</h2><div class="table-responsive"><table class="table data-table act-edit-table">
            <thead><tr><th>Изделие</th><th>Доступно</th><th>Количество</th><th>Куда входит</th><th>Цеховой номер</th><th>Примечание</th></tr></thead>
            <tbody><tr th:each="line,stat:*{items}">
                <td><input type="hidden" th:field="*{items[__${stat.index}__].projectItem.id}"><strong th:text="${line.projectItem.catalogItem.designation?:'—'}"></strong><small th:text="${line.projectItem.catalogItem.name}"></small></td>
                <td><span th:text="${available[line.projectItem.id].stripTrailingZeros().toPlainString()+' '+line.projectItem.catalogItem.unit}"></span><small class="cell-meta" th:text="${'Требуется: '+line.projectItem.requiredQuantity.stripTrailingZeros().toPlainString()}"></small></td>
                <td><input class="form-control form-control-sm" type="number" min="0.0001" step="0.0001" th:attr="max=${available[line.projectItem.id]}" th:field="*{items[__${stat.index}__].quantity}"></td>
                <td><input class="form-control form-control-sm" th:field="*{items[__${stat.index}__].destinationDesignation}"></td>
                <td><input class="form-control form-control-sm" th:field="*{items[__${stat.index}__].shopNumber}"></td>
                <td><input class="form-control form-control-sm" th:field="*{items[__${stat.index}__].notes}"></td>
            </tr><tr th:if="${#lists.isEmpty(transferAct.items)}"><td colspan="6"><div class="empty-state"><strong>В акте пока нет позиций</strong></div></td></tr></tbody>
        </table></div></div>
        <div class="form-actions"><button class="btn btn-primary btn-sm" th:text="${editing?'Сохранить':'Создать черновик'}"></button><a class="btn btn-secondary btn-sm" th:href="${editing}?@{/transfer-acts/{id}(id=${transferAct.id})}:@{/projects/{id}/configuration(id=${transferAct.project.id})}">Отмена</a></div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body></html>
