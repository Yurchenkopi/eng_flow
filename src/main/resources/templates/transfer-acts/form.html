<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Новый акт')}"></head><body><nav th:replace="~{fragments/layout :: navigation('transfer-acts')}"></nav><main class="app-main"><a class="back-link" th:href="@{/projects/{id}/configuration(id=${transferAct.project.id})}">← Комплектация</a><header class="page-header"><div><h1>Новый акт приема-передачи</h1><p th:text="${transferAct.project.designation+' — '+transferAct.project.name}"></p></div></header><form class="content-card form-card form-card-wide" method="post" th:object="${transferAct}" th:action="@{/transfer-acts}"><input type="hidden" th:field="*{project.id}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error:${#fields.globalErrors()}" th:text="${error}"></div><div class="form-section"><div class="row g-3"><div class="col-md-3"><label class="form-label">Дата *</label><input class="form-control" type="date" th:field="*{actDate}"></div><div class="col-md-4"><label class="form-label">Сдал *</label><input class="form-control" th:field="*{deliveredBy}"><div class="text-danger small" th:errors="*{deliveredBy}"></div></div><div class="col-md-4"><label class="form-label">Принял *</label><input class="form-control" th:field="*{receivedBy}"><div class="text-danger small" th:errors="*{receivedBy}"></div></div><div class="col-12"><label class="form-label">Примечание</label><textarea class="form-control" rows="2" th:field="*{notes}"></textarea></div></div></div><div class="form-section"><h2>Позиции</h2><div class="table-responsive"><table class="table data-table act-edit-table"><thead><tr><th>Изделие</th><th>Количество</th><th>Куда входит</th><th>Цеховой номер</th><th>Примечание</th></tr></thead><tbody><tr th:each="line,stat:*{items}"><td><input type="hidden" th:field="*{items[__${stat.index}__].projectItem.id}"><strong th:text="${line.projectItem.catalogItem.designation?:'—'}"></strong><small th:text="${line.projectItem.catalogItem.name}"></small></td><td><input class="form-control form-control-sm" type="number" min="0.0001" step="0.0001" th:field="*{items[__${stat.index}__].quantity}"></td><td><input class="form-control form-control-sm" th:field="*{items[__${stat.index}__].destinationDesignation}"></td><td><input class="form-control form-control-sm" th:field="*{items[__${stat.index}__].shopNumber}"></td><td><input class="form-control form-control-sm" th:field="*{items[__${stat.index}__].notes}"></td></tr></tbody></table></div></div><div class="form-actions"><button class="btn btn-primary btn-sm">Создать акт</button><a class="btn btn-outline-secondary btn-sm" th:href="@{/projects/{id}/configuration(id=${transferAct.project.id})}">Отмена</a></div></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
