<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Проекты')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navigation('projects')}"></nav>
<main class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-start mb-3">
        <div class="page-heading"><h1>Проекты</h1><p>Конструкции и установки EngFlow</p></div>
        <a class="btn btn-primary" th:href="@{/projects/new}">Новый проект</a>
    </div>
    <div th:replace="~{fragments/layout :: messages}"></div>
    <section class="content-card">
        <div class="table-responsive">
            <table class="table table-sm app-table mb-0 align-middle">
                <thead><tr><th>Обозначение</th><th>Наименование</th><th>Модификация</th><th>Заказчик</th><th>Статус</th><th class="text-end">Кол-во</th><th>Завершен</th><th></th></tr></thead>
                <tbody>
                <tr th:each="project : ${projects}">
                    <td class="text-nowrap"><a class="fw-semibold" th:href="@{/projects/{id}(id=${project.id})}" th:text="${project.designation}"></a></td>
                    <td th:text="${project.name}"></td>
                    <td th:text="${project.modificationName ?: '—'}"></td>
                    <td th:text="${project.customer != null ? project.customer.name : '—'}"></td>
                    <td><span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(project.status.name())}" th:text="${project.status.displayName}"></span></td>
                    <td class="text-end" th:text="${project.quantity}"></td>
                    <td class="text-nowrap" th:text="${project.completionDate != null ? #temporals.format(project.completionDate, 'dd.MM.yyyy') : '—'}"></td>
                    <td class="text-end"><a class="btn btn-sm btn-outline-secondary" th:href="@{/projects/{id}/edit(id=${project.id})}">Изменить</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(projects)}"><td colspan="8" class="empty-state">Проекты пока не созданы</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
