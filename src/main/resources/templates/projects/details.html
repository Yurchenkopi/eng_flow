<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${project.designation})}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="container-fluid px-4 py-4">
<div class="d-flex justify-content-between align-items-start mb-3"><div class="page-heading"><h1 th:text="${project.designation}"></h1><p th:text="${project.name}"></p></div><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/edit(id=${project.id})}">Редактировать</a></div><div th:replace="~{fragments/layout :: messages}"></div>
<section class="content-card details-card mb-4"><h2 class="section-title">Общая информация</h2><dl class="row detail-list mb-0"><dt class="col-sm-3">Обозначение</dt><dd class="col-sm-9" th:text="${project.designation}"></dd><dt class="col-sm-3">Наименование</dt><dd class="col-sm-9" th:text="${project.name}"></dd><dt class="col-sm-3">Модификация</dt><dd class="col-sm-9" th:text="${project.modificationName ?: '—'}"></dd><dt class="col-sm-3">Заказчик</dt><dd class="col-sm-9" th:text="${project.customer != null ? project.customer.name : '—'}"></dd><dt class="col-sm-3">Статус</dt><dd class="col-sm-9" th:text="${project.status.displayName}"></dd><dt class="col-sm-3">Количество</dt><dd class="col-sm-9" th:text="${project.quantity}"></dd><dt class="col-sm-3">Дата завершения</dt><dd class="col-sm-9" th:text="${project.completionDate != null ? #temporals.format(project.completionDate, 'dd.MM.yyyy') : '—'}"></dd><dt class="col-sm-3">Исходный проект</dt><dd class="col-sm-9"><a th:if="${project.basedOnProject != null}" th:href="@{/projects/{id}(id=${project.basedOnProject.id})}" th:text="${project.basedOnProject.designation}"></a><span th:if="${project.basedOnProject == null}">—</span></dd><dt class="col-sm-3">Описание</dt><dd class="col-sm-9 preserve-lines" th:text="${project.description ?: '—'}"></dd></dl></section>
<a class="configuration-preview" th:href="@{/projects/{id}/configuration(id=${project.id})}"><div><strong>Комплектация</strong><span th:text="${configurationCount + ' позиций'}"></span></div><span class="configuration-arrow">→</span></a>
<div class="content-card mt-2" th:if="${!#lists.isEmpty(configurationPreview)}"><div class="table-responsive"><table class="table app-table mb-0"><tbody><tr th:each="item : ${configurationPreview}"><td th:text="${item.catalogItem.designation ?: '—'}"></td><td th:text="${item.catalogItem.name}"></td><td class="text-end" th:text="${item.requiredQuantity.stripTrailingZeros().toPlainString() + ' ' + item.catalogItem.unit}"></td></tr></tbody></table></div></div>
<a class="btn btn-link px-0 mt-3" th:href="@{/projects}">← К списку проектов</a></main><script th:replace="~{fragments/layout :: scripts}"></script></body></html>
