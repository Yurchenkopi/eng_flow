<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${project.designation})}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="app-container"><header class="page-header"><div><h1 class="page-title" th:text="${project.designation}"></h1><p class="page-subtitle" th:text="${project.name+(project.modificationName!=null?' · '+project.modificationName:'')}"></p></div><a class="btn btn-secondary btn-sm" th:href="@{/projects/{id}/edit(id=${project.id})}">Редактировать</a></header><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card details-card"><h2 class="section-heading">Общая информация</h2><dl class="row detail-list mb-0"><dt class="col-sm-3">Модификация</dt><dd class="col-sm-9" th:text="${project.modificationName?:'—'}"></dd><dt class="col-sm-3">Заказчик</dt><dd class="col-sm-9" th:text="${project.customer!=null?project.customer.name:'—'}"></dd><dt class="col-sm-3">Статус</dt><dd class="col-sm-9"><span class="status-badge" th:classappend="${' status-'+#strings.toLowerCase(project.status.name())}" th:text="${project.status.displayName}"></span></dd><dt class="col-sm-3">Количество</dt><dd class="col-sm-9" th:text="${project.quantity}"></dd><dt class="col-sm-3">Дата завершения</dt><dd class="col-sm-9" th:text="${project.completionDate!=null?#temporals.format(project.completionDate,'dd.MM.yyyy'):'—'}"></dd><dt class="col-sm-3">Исходный проект</dt><dd class="col-sm-9" th:text="${project.basedOnProject!=null?project.basedOnProject.designation:'—'}"></dd><dt class="col-sm-3">Описание</dt><dd class="col-sm-9 preserve-lines" th:text="${project.description?:'—'}"></dd></dl></section><a class="action-tile" th:href="@{/projects/{id}/configuration(id=${project.id})}"><span><strong>Комплектация</strong><small th:text="${configurationCount+' позиций'}"></small></span><b>→</b></a></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
