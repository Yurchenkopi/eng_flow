<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: navigation('organizations')}"></nav><main class="app-main"><header class="page-header"><div><h1 th:text="${pageTitle}"></h1><p th:text="${organization.name}"></p></div></header><form class="content-card form-card" method="post" th:object="${contact}" th:action="${contact.id==null}?@{/organizations/{o}/contacts(o=${organization.id})}:@{/organizations/{o}/contacts/{id}(o=${organization.id},id=${contact.id})}"><div class="row g-3"><div class="col-md-7"><label class="form-label">ФИО *</label><input class="form-control" th:field="*{fullName}"><div class="text-danger small" th:errors="*{fullName}"></div></div><div class="col-md-5"><label class="form-label">Должность</label><input class="form-control" th:field="*{position}"></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}"><div class="text-danger small" th:errors="*{email}"></div></div><div class="col-md-6"><label class="form-label">Телефон</label><input class="form-control" th:field="*{phone}"></div><div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{primary}"><label class="form-check-label">Основной контакт</label></div></div><div class="col-12"><label class="form-label">Примечания</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div><div class="form-actions"><button class="btn btn-primary btn-sm">Сохранить</button><a class="btn btn-outline-secondary btn-sm" th:href="@{/organizations/{id}/edit(id=${organization.id})}">Отмена</a></div></form></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
