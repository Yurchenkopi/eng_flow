<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Изделия')}"></head><body><nav th:replace="~{fragments/layout :: navigation('catalog-items')}"></nav><main class="app-main"><header class="page-header"><div><h1>Изделия</h1><p>Общий каталог покупных изделий</p></div><a class="btn btn-primary btn-sm" th:href="@{/catalog-items/new}">Новое изделие</a></header><div th:replace="~{fragments/layout :: messages}"></div><form class="toolbar catalog-toolbar" method="get"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><input class="form-control" name="query" th:value="${query}" placeholder="Обозначение, наименование или производитель"><button class="btn btn-outline-secondary btn-sm">Найти</button><a class="btn btn-link btn-sm" th:href="@{/catalog-items}">Сбросить</a></form><section class="content-card"><div class="table-responsive"><table class="table data-table mb-0"><thead><tr><th>№</th><th>Обозначение</th><th>Наименование</th><th>Производитель</th><th>Ед.</th><th>Примечание</th><th>Проектов</th><th>Действия</th></tr></thead><tbody><tr class="clickable-row" th:each="item,stat:${items}" th:attr="data-href=@{/catalog-items/{id}/edit(id=${item.id})}"><td th:text="${stat.count}"></td><td th:text="${item.designation?:'—'}"></td><td class="fw-semibold" th:text="${item.name}"></td><td th:text="${item.manufacturer?:'—'}"></td><td th:text="${item.unit}"></td><td class="notes-cell" th:text="${item.notes?:'—'}"></td><td th:text="${usageCounts[item.id]}"></td><td class="text-nowrap"><a class="btn btn-outline-secondary btn-sm" th:href="@{/catalog-items/{id}/edit(id=${item.id})}">Изм.</a> <a class="btn btn-outline-secondary btn-sm" th:href="@{/catalog-items/{id}/copy(id=${item.id})}">Копия</a></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="8" class="empty-state">Изделия не найдены</td></tr></tbody></table></div></section></main><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
