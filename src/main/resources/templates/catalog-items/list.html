<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Изделия')}"></head><body><nav th:replace="~{fragments/layout :: navigation('catalog-items')}"></nav><main class="container-fluid px-4 py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div class="page-heading"><h1>Изделия</h1><p>Общий каталог покупных изделий</p></div><a class="btn btn-primary" th:href="@{/catalog-items/new}">Новое изделие</a></div><div th:replace="~{fragments/layout :: messages}"></div>
<form class="row g-2 mb-3" method="get"><input type="hidden" name="sort" th:value="${sort}"><input type="hidden" name="direction" th:value="${direction}"><div class="col-lg-6"><input class="form-control" name="query" th:value="${query}" placeholder="Обозначение, наименование или производитель"></div><div class="col-auto"><button class="btn btn-outline-primary">Найти</button></div><div class="col-auto"><a class="btn btn-link" th:href="@{/catalog-items}">Сбросить</a></div></form>
<section class="content-card"><div class="table-responsive"><table class="table app-table compact-table mb-0"><thead><tr><th>№</th><th><a th:href="@{/catalog-items(query=${query},sort='designation',direction=${sort == 'designation' and direction == 'asc' ? 'desc' : 'asc'})}">Обозначение <span th:if="${sort == 'designation'}" th:text="${direction == 'asc' ? '↑' : '↓'}"></span></a></th><th><a th:href="@{/catalog-items(query=${query},sort='name',direction=${sort == 'name' and direction == 'asc' ? 'desc' : 'asc'})}">Наименование <span th:if="${sort == 'name'}" th:text="${direction == 'asc' ? '↑' : '↓'}"></span></a></th><th><a th:href="@{/catalog-items(query=${query},sort='manufacturer',direction=${sort == 'manufacturer' and direction == 'asc' ? 'desc' : 'asc'})}">Производитель <span th:if="${sort == 'manufacturer'}" th:text="${direction == 'asc' ? '↑' : '↓'}"></span></a></th><th>Ед.</th><th>Примечание</th><th>Проектов</th><th>Действия</th></tr></thead><tbody><tr th:each="item,stat : ${items}"><td th:text="${stat.count}"></td><td th:text="${item.designation ?: '—'}"></td><td th:text="${item.name}"></td><td th:text="${item.manufacturer ?: '—'}"></td><td th:text="${item.unit}"></td><td class="notes-cell" th:text="${item.notes ?: '—'}"></td><td th:text="${usageCounts[item.id]}"></td><td class="text-nowrap"><a class="btn btn-outline-secondary btn-sm" th:href="@{/catalog-items/{id}/edit(id=${item.id})}">Изм.</a> <a class="btn btn-outline-secondary btn-sm" th:href="@{/catalog-items/{id}/copy(id=${item.id})}">Копия</a></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="8" class="empty-state">Изделия не найдены</td></tr></tbody></table></div></section></main><script th:replace="~{fragments/layout :: scripts}"></script></body></html>
