<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body>
<nav th:replace="~{fragments/layout :: navigation('catalog-items')}"></nav><main class="container-fluid px-4 py-4"><div class="page-heading mb-3"><h1 th:text="${pageTitle}"></h1></div><div th:replace="~{fragments/layout :: messages}"></div>
<form class="content-card form-card" method="post" th:object="${catalogItem}" th:action="${catalogItem.id==null}?@{/catalog-items}:@{/catalog-items/{id}(id=${catalogItem.id})}">
<input type="hidden" name="projectId" th:if="${projectId!=null}" th:value="${projectId}"><div class="row g-3">
<div class="col-md-4"><label class="form-label">Обозначение</label><input class="form-control" th:field="*{designation}"></div>
<div class="col-md-8"><label class="form-label">Наименование *</label><input class="form-control" th:field="*{name}"></div>
<div class="col-md-6"><label class="form-label">Производитель</label><input class="form-control" th:field="*{manufacturer}"></div>
<div class="col-md-3"><label class="form-label">Единица *</label><select class="form-select" th:field="*{measurementUnit.id}" required><option value="">Выберите единицу</option><option th:each="unit:${measurementUnits}" th:value="${unit.id}" th:text="${unit.name}"></option></select></div>
<div class="col-12"><label class="form-label">Примечание</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div>
<div class="form-actions"><button class="btn btn-primary">Сохранить</button><a class="btn btn-outline-secondary" th:href="${projectId!=null}?@{/projects/{id}/items/new(id=${projectId})}:@{/catalog-items}">Отмена</a></div></form>
<section class="content-card mt-3" th:if="${catalogItem.id!=null}"><div class="content-card-header"><h2>Поставщики</h2></div><div th:if="${#lists.isEmpty(itemSuppliers)}" class="empty-state">Поставщики пока не добавлены</div><div class="table-responsive" th:unless="${#lists.isEmpty(itemSuppliers)}"><table class="table data-table mb-0"><thead><tr><th>Организация</th><th>Артикул</th><th>Примечание</th><th></th></tr></thead><tbody><tr th:each="relation:${itemSuppliers}"><td th:text="${relation.supplier.shortName?:relation.supplier.name}"></td><td th:text="${relation.supplierArticle?:'—'}"></td><td th:text="${relation.notes?:'—'}"></td><td class="text-nowrap"><a class="btn btn-ghost btn-sm" th:href="@{/catalog-items/{itemId}/suppliers/{id}/edit(itemId=${catalogItem.id},id=${relation.id})}">Изменить</a><form class="d-inline" method="post" th:action="@{/catalog-items/{itemId}/suppliers/{id}/delete(itemId=${catalogItem.id},id=${relation.id})}" onsubmit="return confirm('Удалить связь с поставщиком?')"><button class="btn btn-ghost btn-sm text-danger">Удалить</button></form></td></tr></tbody></table></div>
<form class="form-grid mt-3" method="post" th:object="${newItemSupplier}" th:action="@{/catalog-items/{id}/suppliers(id=${catalogItem.id})}"><div><label class="form-label">Поставщик</label><select class="form-select" th:field="*{supplier.id}" required><option value="">Выберите организацию</option><option th:each="supplier:${availableSuppliers}" th:value="${supplier.id}" th:text="${supplier.name}"></option></select></div><div><label class="form-label">Артикул</label><input class="form-control" th:field="*{supplierArticle}"></div><div><label class="form-label">Примечание</label><input class="form-control" th:field="*{notes}"></div><div class="align-self-end"><button class="btn btn-primary btn-sm">+ Добавить поставщика</button></div></form></section>
</main><script th:replace="~{fragments/layout :: scripts}"></script></body></html>
