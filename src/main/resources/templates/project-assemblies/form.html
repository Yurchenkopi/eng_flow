<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${pageTitle})}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="container-fluid px-4 py-4"><div class="page-heading mb-3"><h1 th:text="${pageTitle}"></h1><p th:text="${project.designation + ' — ' + project.name}"></p></div><form class="content-card form-card" method="post" th:object="${assembly}" th:action="${assembly.id == null} ? @{/projects/{p}/assemblies(p=${project.id})} : @{/projects/{p}/assemblies/{id}(p=${project.id},id=${assembly.id})}"><div class="row g-3"><div class="col-md-8"><label class="form-label">Наименование <span class="required">*</span></label><input class="form-control" th:field="*{name}"><div class="text-danger small" th:errors="*{name}"></div></div><div class="col-md-4"><label class="form-label">Обозначение</label><input class="form-control" th:field="*{designation}"></div><div class="col-12"><label class="form-label">Примечание</label><textarea class="form-control" rows="3" th:field="*{notes}"></textarea></div></div><div class="form-actions"><button class="btn btn-primary">Сохранить</button><a class="btn btn-outline-secondary" th:href="@{/projects/{id}/configuration(id=${project.id})}">Отмена</a></div></form></main><script th:replace="~{fragments/layout :: scripts}"></script></body></html>
