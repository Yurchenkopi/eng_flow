<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Разделы комплектации')}"></head><body><nav th:replace="~{fragments/layout :: navigation('projects')}"></nav><main class="container-fluid px-4 py-4"><a class="small text-decoration-none" th:href="@{/projects/{id}/configuration(id=${project.id})}">← Комплектация</a><div class="d-flex justify-content-between align-items-end my-2"><div class="page-heading"><h1>Разделы комплектации</h1><p th:text="${project.designation + ' — ' + project.name}"></p></div><a class="btn btn-primary btn-sm" th:href="@{/projects/{id}/assemblies/new(id=${project.id})}">+ Раздел</a></div><div th:replace="~{fragments/layout :: messages}"></div><section class="content-card"><div class="table-responsive"><table class="table app-table mb-0"><thead><tr><th>Обозначение</th><th>Раздел</th><th>Примечание</th><th></th></tr></thead><tbody><tr th:each="section : ${assemblies}"><td th:text="${section.designation ?: '—'}"></td><td th:text="${section.name}"></td><td th:text="${section.notes ?: '—'}"></td><td class="text-end"><a class="btn btn-outline-secondary btn-sm" th:href="@{/projects/{p}/assemblies/{id}/edit(p=${project.id},id=${section.id})}">Редактировать</a></td></tr><tr th:if="${#lists.isEmpty(assemblies)}"><td colspan="4" class="empty-state">Разделов пока нет</td></tr></tbody></table></div></section></main><script th:replace="~{fragments/layout :: scripts}"></script></body></html>
