spring:
  application:
    name: EngFlow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eng_flow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  thymeleaf:
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: INFO
