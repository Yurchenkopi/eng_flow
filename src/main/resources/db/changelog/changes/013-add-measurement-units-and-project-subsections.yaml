databaseChangeLog:
  - changeSet:
      id: 013-add-measurement-units-and-project-subsections
      author: engflow
      changes:
        - createTable:
            tableName: measurement_units
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(30), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_measurement_units_name } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - sql:
            sql: INSERT INTO measurement_units (name) VALUES ('шт.'), ('мм'), ('м'), ('кг'), ('г'), ('л'), ('компл.')
        - sql:
            sql: INSERT INTO measurement_units (name) SELECT DISTINCT ci.unit FROM catalog_items ci WHERE ci.unit IS NOT NULL AND NOT EXISTS (SELECT 1 FROM measurement_units mu WHERE mu.name = ci.unit)
        - addColumn:
            tableName: catalog_items
            columns:
              - column: { name: measurement_unit_id, type: BIGINT }
        - sql:
            sql: UPDATE catalog_items ci SET measurement_unit_id = (SELECT mu.id FROM measurement_units mu WHERE mu.name = ci.unit)
        - addNotNullConstraint: { tableName: catalog_items, columnName: measurement_unit_id, columnDataType: BIGINT }
        - addForeignKeyConstraint: { baseTableName: catalog_items, baseColumnNames: measurement_unit_id, referencedTableName: measurement_units, referencedColumnNames: id, constraintName: fk_catalog_items_measurement_unit }
        - createIndex: { tableName: catalog_items, indexName: idx_catalog_items_measurement_unit_id, columns: [{ column: { name: measurement_unit_id } }] }
        - dropColumn: { tableName: catalog_items, columnName: unit }
        - createTable:
            tableName: project_subsections
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: project_assembly_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: designation, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: applies_for, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: project_subsections, baseColumnNames: project_assembly_id, referencedTableName: project_assemblies, referencedColumnNames: id, constraintName: fk_project_subsections_assembly, onDelete: CASCADE }
        - addUniqueConstraint: { tableName: project_subsections, columnNames: 'project_assembly_id, designation', constraintName: uk_project_subsections_assembly_designation }
        - createIndex: { tableName: project_subsections, indexName: idx_project_subsections_assembly_id, columns: [{ column: { name: project_assembly_id } }] }
        - addColumn:
            tableName: project_item_allocations
            columns:
              - column: { name: project_subsection_id, type: BIGINT }
        - addForeignKeyConstraint: { baseTableName: project_item_allocations, baseColumnNames: project_subsection_id, referencedTableName: project_subsections, referencedColumnNames: id, constraintName: fk_project_item_allocations_subsection }
        - createIndex: { tableName: project_item_allocations, indexName: idx_project_item_allocations_subsection_id, columns: [{ column: { name: project_subsection_id } }] }
        - addColumn:
            tableName: transfer_act_items
            columns:
              - column: { name: applies_for, type: VARCHAR(255) }
