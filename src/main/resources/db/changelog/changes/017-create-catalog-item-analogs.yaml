databaseChangeLog:
  - changeSet:
      id: 017-create-catalog-item-analogs
      author: engflow
      changes:
        - createTable:
            tableName: catalog_item_analogs
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: first_catalog_item_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: second_catalog_item_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: catalog_item_analogs, baseColumnNames: first_catalog_item_id, referencedTableName: catalog_items, referencedColumnNames: id, constraintName: fk_catalog_item_analogs_first }
        - addForeignKeyConstraint: { baseTableName: catalog_item_analogs, baseColumnNames: second_catalog_item_id, referencedTableName: catalog_items, referencedColumnNames: id, constraintName: fk_catalog_item_analogs_second }
        - addUniqueConstraint: { tableName: catalog_item_analogs, columnNames: 'first_catalog_item_id, second_catalog_item_id', constraintName: uk_catalog_item_analogs_pair }
        - sql:
            sql: ALTER TABLE catalog_item_analogs ADD CONSTRAINT ck_catalog_item_analogs_order CHECK (first_catalog_item_id < second_catalog_item_id)
        - createIndex: { tableName: catalog_item_analogs, indexName: idx_catalog_item_analogs_second, columns: [{ column: { name: second_catalog_item_id } }] }
