databaseChangeLog:
  - changeSet:
      id: 006-add-organization-roles-and-contacts
      author: engflow
      changes:
        - createTable:
            tableName: organization_roles
            columns:
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: role, type: VARCHAR(30), constraints: { nullable: false } }
        - addPrimaryKey: { tableName: organization_roles, columnNames: 'organization_id, role', constraintName: pk_organization_roles }
        - addForeignKeyConstraint: { baseTableName: organization_roles, baseColumnNames: organization_id, referencedTableName: organizations, referencedColumnNames: id, constraintName: fk_organization_roles_organization, onDelete: CASCADE }
        - sql: { sql: "INSERT INTO organization_roles (organization_id, role) SELECT id, 'CUSTOMER' FROM organizations" }
        - createIndex:
            tableName: organization_roles
            indexName: idx_organization_roles_role
            columns: [{ column: { name: role } }]
        - createTable:
            tableName: contacts
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: organization_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: full_name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: position, type: VARCHAR(255) }
              - column: { name: email, type: VARCHAR(255) }
              - column: { name: phone, type: VARCHAR(100) }
              - column: { name: is_primary, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: notes, type: TEXT }
        - addForeignKeyConstraint: { baseTableName: contacts, baseColumnNames: organization_id, referencedTableName: organizations, referencedColumnNames: id, constraintName: fk_contacts_organization, onDelete: CASCADE }
        - createIndex:
            tableName: contacts
            indexName: idx_contacts_organization_id
            columns: [{ column: { name: organization_id } }]
