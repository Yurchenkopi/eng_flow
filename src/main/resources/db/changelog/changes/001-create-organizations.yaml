databaseChangeLog:
  - changeSet:
      id: 001-create-organizations
      author: engflow
      changes:
        - createTable:
            tableName: organizations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: short_name
                  type: VARCHAR(100)
              - column:
                  name: inn
                  type: VARCHAR(12)
              - column:
                  name: notes
                  type: TEXT
