databaseChangeLog:
  - changeSet:
      id: 004-create-project-assemblies
      author: engflow
      changes:
        - createTable:
            tableName: project_assemblies
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: project_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: designation, type: VARCHAR(255) }
              - column: { name: notes, type: TEXT }
        - addForeignKeyConstraint: { baseTableName: project_assemblies, baseColumnNames: project_id, referencedTableName: projects, referencedColumnNames: id, constraintName: fk_project_assemblies_project }
        - createIndex:
            tableName: project_assemblies
            indexName: idx_project_assemblies_project_id
            columns: [{ column: { name: project_id } }]
        - createIndex:
            tableName: project_assemblies
            indexName: idx_project_assemblies_project_name
            columns: [{ column: { name: project_id } }, { column: { name: name } }]
